
# ============================================================
# ADAMA MUNICIPAL REVENUE
# NGINX GATEWAY AND DOMAIN CERTIFICATE VALIDATION
# ============================================================

- name: Ensure production certificate environment
  ansible.builtin.assert:
    that:
      - not (ssl_certbot_staging | bool)
    fail_msg: Nginx production validation requires a production certificate.

- name: Check certificate fullchain
  ansible.builtin.stat:
    path: "{{ ssl_certificate_fullchain }}"
    follow: true
  register: ssl_nginx_fullchain

- name: Check certificate private key
  ansible.builtin.stat:
    path: "{{ ssl_certificate_private_key }}"
    follow: true
  register: ssl_nginx_private_key

- name: Verify certificate files exist
  ansible.builtin.assert:
    that:
      - ssl_nginx_fullchain.stat.exists
      - ssl_nginx_fullchain.stat.isreg
      - ssl_nginx_private_key.stat.exists
      - ssl_nginx_private_key.stat.isreg
    fail_msg: >-
      Certificate files are missing or invalid.

- name: Validate certificate expiration
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ ssl_certificate_fullchain }}"
      - -checkend
      - "0"
      - -noout
  changed_when: false

- name: Validate certificate domains
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ ssl_certificate_fullchain }}"
      - -checkhost
      - "{{ item }}"
      - -noout
  loop: "{{ ssl_certificate_domains }}"
  register: ssl_nginx_domain_checks
  changed_when: false

- name: Verify all certificate domains
  ansible.builtin.assert:
    that:
      - ssl_nginx_domain_checks.results | length == ssl_certificate_domains | length
      - >-
        ssl_nginx_domain_checks.results
        | map(attribute='rc')
        | select('equalto', 0)
        | list
        | length == ssl_certificate_domains | length
    fail_msg: Certificate does not cover every configured domain.

- name: Check gateway Compose file
  ansible.builtin.stat:
    path: "{{ ssl_gateway_compose_file }}"
  register: ssl_gateway_compose_stat

- name: Verify gateway Compose file exists
  ansible.builtin.assert:
    that:
      - ssl_gateway_compose_stat.stat.exists
      - ssl_gateway_compose_stat.stat.isreg
    fail_msg: Gateway Compose file was not found.

- name: Validate gateway Compose configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - "{{ ssl_gateway_compose_project }}"
      - -f
      - "{{ ssl_gateway_compose_file }}"
      - config
      - --quiet
  changed_when: false

- name: Discover Nginx gateway container
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -p
      - "{{ ssl_gateway_compose_project }}"
      - -f
      - "{{ ssl_gateway_compose_file }}"
      - ps
      - -q
      - "{{ ssl_gateway_service }}"
  register: ssl_gateway_container_id
  changed_when: false

- name: Verify Nginx gateway container exists
  ansible.builtin.assert:
    that:
      - ssl_gateway_container_id.stdout | trim | length > 0
    fail_msg: Nginx gateway container was not found.

- name: Inspect Nginx gateway container
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ ssl_gateway_container_id.stdout | trim }}"
  register: ssl_gateway_container_inspect
  changed_when: false

- name: Verify Nginx gateway container state
  ansible.builtin.assert:
    that:
      - >-
        (ssl_gateway_container_inspect.stdout | from_json | first)
        ['State']['Running']
    fail_msg: Nginx gateway container is not running.

- name: Test Nginx configuration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ ssl_gateway_container_id.stdout | trim }}"
      - nginx
      - -t
  register: ssl_nginx_config_test
  changed_when: false

- name: Display Nginx gateway validation summary
  ansible.builtin.debug:
    msg:
      - "Certificate: {{ ssl_certificate_name }}"
      - "Domains: {{ ssl_certificate_domains | join(', ') }}"
      - "Certificate expiration: valid"
      - "Domain verification: passed"
      - "Gateway Compose configuration: valid"
      - "Gateway container: running"
      - "Nginx configuration test: passed"
      - "Nginx reload: not performed"
