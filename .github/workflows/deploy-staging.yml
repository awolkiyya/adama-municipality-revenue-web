
name: Deploy Staging

on:
  push:
    branches:
      - staging

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      STAGING_PUBLIC_IP: 196.190.216.41
      ACME_TEST_TOKEN: deployment-check
      ACME_TEST_RESPONSE: acme-test-success

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Configure SSH
      # --------------------------------------------------

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configured successfully."

      # --------------------------------------------------
      # 3. Validate and package source
      # --------------------------------------------------

      - name: Package application source
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "Validating deployment source"
          echo "========================================"

          test -f docker/Dockerfile
          test -f docker/compose.yml
          test -f docker/compose.staging.yml
          test -f docker/compose.gateway.yml
          test -f nginx/nginx.conf
          test -f nginx/gateway.conf

          echo "Verifying ACME HTTP-01 configuration..."

          grep -Fq \
            '/opt/adama-revenue/web_app/certificates/www:/var/www/certbot:ro' \
            docker/compose.gateway.yml

          grep -Fq \
            'location ^~ /.well-known/acme-challenge/' \
            nginx/gateway.conf

          echo "ACME configuration verified."

          echo "Packaging staging source..."

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='coverage' \
            --exclude='certificates' \
            -czf "$RUNNER_TEMP/staging-source.tar.gz" .

          test -s "$RUNNER_TEMP/staging-source.tar.gz"

          tar -tzf "$RUNNER_TEMP/staging-source.tar.gz" > /dev/null

          echo "Source package created successfully."
          echo "Commit: $GITHUB_SHA"

      # --------------------------------------------------
      # 4. Transfer source to staging server
      # --------------------------------------------------

      - name: Transfer source code
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"

          scp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/staging-source.tar.gz" \
            "$STAGING_USER@$STAGING_HOST:/tmp/adama-staging-source.tar.gz"

          echo "Source transferred successfully."

      # --------------------------------------------------
      # 5. Build and deploy application + gateway
      # --------------------------------------------------

      - name: Build and deploy staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'

          set -Eeuo pipefail

          # ------------------------------------------------
          # Deployment configuration
          # ------------------------------------------------

          APP_ROOT="/opt/adama-revenue/web_app"

          SOURCE_DIR="$APP_ROOT/source-staging"

          ENV_FILE="$APP_ROOT/.env.staging"

          ARCHIVE="/tmp/adama-staging-source.tar.gz"

          IMAGE="adama-revenue-web:staging"

          ACME_WEBROOT="$APP_ROOT/certificates/www"

          ACME_CHALLENGE_DIR="$ACME_WEBROOT/.well-known/acme-challenge"

          ACME_TEST_FILE="$ACME_CHALLENGE_DIR/deployment-check"

          EXPECTED_RESPONSE="acme-test-success"

          export IMAGE

          cd "$APP_ROOT"

          echo "========================================"
          echo "STAGING DEPLOYMENT"
          echo "========================================"

          echo "Source directory: $SOURCE_DIR"
          echo "Image: $IMAGE"

          # ------------------------------------------------
          # 6. Verify deployment prerequisites
          # ------------------------------------------------

          echo "========================================"
          echo "Checking deployment prerequisites"
          echo "========================================"

          test -s "$ENV_FILE"
          test -s "$ARCHIVE"

          docker --version
          docker compose version

          tar -tzf "$ARCHIVE" > /dev/null

          # ------------------------------------------------
          # 7. Initialize ACME webroot
          # ------------------------------------------------

          echo "========================================"
          echo "Initializing ACME HTTP-01 webroot"
          echo "========================================"

          # Docker creates the host bind-mount directory
          # and initializes its permissions as root.
          # This avoids requiring an interactive sudo password.

          docker run \
            --rm \
            --entrypoint sh \
            --volume "$ACME_WEBROOT:/webroot" \
            nginx:1.28-alpine \
            -c '
              mkdir -p /webroot/.well-known/acme-challenge &&
              chmod 755 /webroot &&
              chmod 755 /webroot/.well-known &&
              chmod 755 /webroot/.well-known/acme-challenge
            '

          echo "ACME webroot initialized."

          # ------------------------------------------------
          # 8. Extract and validate source
          # ------------------------------------------------

          echo "========================================"
          echo "Extracting staging source"
          echo "========================================"

          EXTRACT_DIR="$(mktemp -d /tmp/adama-staging-source.XXXXXX)"

          trap 'rm -rf -- "$EXTRACT_DIR"; rm -f -- "$ARCHIVE"' EXIT

          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR"

          # Validate extracted source before replacing
          # the existing staging source.

          test -f "$EXTRACT_DIR/docker/Dockerfile"
          test -f "$EXTRACT_DIR/docker/compose.yml"
          test -f "$EXTRACT_DIR/docker/compose.staging.yml"
          test -f "$EXTRACT_DIR/docker/compose.gateway.yml"
          test -f "$EXTRACT_DIR/nginx/nginx.conf"
          test -f "$EXTRACT_DIR/nginx/gateway.conf"

          # ------------------------------------------------
          # 9. Verify ACME source configuration
          # ------------------------------------------------

          echo "========================================"
          echo "Verifying ACME source configuration"
          echo "========================================"

          grep -Fq \
            '/opt/adama-revenue/web_app/certificates/www:/var/www/certbot:ro' \
            "$EXTRACT_DIR/docker/compose.gateway.yml"

          grep -Fq \
            'location ^~ /.well-known/acme-challenge/' \
            "$EXTRACT_DIR/nginx/gateway.conf"

          echo "ACME source configuration verified."

          # ------------------------------------------------
          # 10. Update source-staging
          # ------------------------------------------------

          echo "========================================"
          echo "Updating staging source"
          echo "========================================"

          mkdir -p "$SOURCE_DIR"

          # Keep source-staging as the only permanent
          # deployment source directory.

          find "$SOURCE_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf -- {} +

          cp -a "$EXTRACT_DIR/." "$SOURCE_DIR/"

          # Remove temporary extracted source.
          rm -rf -- "$EXTRACT_DIR"

          # ------------------------------------------------
          # 11. Read staging API URL
          # ------------------------------------------------

          echo "Reading staging API URL..."

          NEXT_PUBLIC_API_URL="$(
            sed -n 's/^NEXT_PUBLIC_API_URL=//p' "$ENV_FILE" | tail -n 1
          )"

          test -n "$NEXT_PUBLIC_API_URL"

          case "$NEXT_PUBLIC_API_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: Invalid NEXT_PUBLIC_API_URL."
              exit 1
              ;;
          esac

          # ------------------------------------------------
          # 12. Build Next.js Docker image
          # ------------------------------------------------

          echo "========================================"
          echo "Building staging Docker image"
          echo "========================================"

          docker build \
            --pull \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -f "$SOURCE_DIR/docker/Dockerfile" \
            -t "$IMAGE" \
            "$SOURCE_DIR"

          echo "Docker image built successfully."

          # ------------------------------------------------
          # 13. Validate application Compose configuration
          # ------------------------------------------------

          echo "Validating application Compose configuration..."

          docker compose \
            -p my-next-staging \
            -f "$SOURCE_DIR/docker/compose.yml" \
            -f "$SOURCE_DIR/docker/compose.staging.yml" \
            config -q

          # ------------------------------------------------
          # 14. Deploy Next.js application
          # ------------------------------------------------

          echo "========================================"
          echo "Deploying staging application"
          echo "========================================"

          docker compose \
            -p my-next-staging \
            -f "$SOURCE_DIR/docker/compose.yml" \
            -f "$SOURCE_DIR/docker/compose.staging.yml" \
            up -d --remove-orphans

          # ------------------------------------------------
          # 15. Wait for application health
          # ------------------------------------------------

          echo "Waiting for staging application health..."

          CONTAINER_ID="$(
            docker compose \
              -p my-next-staging \
              -f "$SOURCE_DIR/docker/compose.yml" \
              -f "$SOURCE_DIR/docker/compose.staging.yml" \
              ps -q app
          )"

          test -n "$CONTAINER_ID"

          HEALTHY=false

          for attempt in $(seq 1 30); do

            STATUS="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                "$CONTAINER_ID" 2>/dev/null || echo "unknown"
            )"

            echo "Application health: $STATUS ($attempt/30)"

            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then

            echo "ERROR: Staging application health check failed."

            docker logs --tail 100 "$CONTAINER_ID"

            exit 1
          fi

          echo "Staging application is healthy."

          # ------------------------------------------------
          # 16. Verify staging Docker network
          # ------------------------------------------------

          echo "Checking staging Docker network..."

          docker network inspect my-next-staging_app-network > /dev/null

          # ------------------------------------------------
          # 17. Validate Nginx gateway Compose configuration
          # ------------------------------------------------

          echo "Validating Nginx gateway Compose configuration..."

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            config -q

          # ------------------------------------------------
          # 18. Test Nginx configuration
          # ------------------------------------------------

          echo "Testing Nginx configuration..."

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            run --rm --no-deps nginx nginx -t

          # ------------------------------------------------
          # 19. Deploy Nginx gateway automatically
          # ------------------------------------------------

          echo "========================================"
          echo "Deploying Nginx gateway"
          echo "========================================"

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            up -d --force-recreate --remove-orphans

          # ------------------------------------------------
          # 20. Identify running Nginx container
          # ------------------------------------------------

          GATEWAY_CONTAINER_ID="$(
            docker compose \
              -p my-next-gateway \
              -f "$SOURCE_DIR/docker/compose.gateway.yml" \
              ps -q nginx
          )"

          test -n "$GATEWAY_CONTAINER_ID"

          # ------------------------------------------------
          # 21. Verify live Nginx configuration
          # ------------------------------------------------

          echo "========================================"
          echo "Verifying live Nginx configuration"
          echo "========================================"

          docker exec "$GATEWAY_CONTAINER_ID" nginx -t

          LIVE_NGINX_CONFIG="$(
            docker exec "$GATEWAY_CONTAINER_ID" nginx -T 2>&1
          )"

          if ! grep -Fq \
            'location ^~ /.well-known/acme-challenge/' \
            <<< "$LIVE_NGINX_CONFIG"; then

            echo "ERROR: ACME location is missing from live Nginx."

            exit 1
          fi

          echo "Live Nginx ACME configuration verified."

          # ------------------------------------------------
          # 22. Verify ACME webroot volume
          # ------------------------------------------------

          echo "========================================"
          echo "Verifying ACME webroot volume"
          echo "========================================"

          MOUNTS="$(
            docker inspect "$GATEWAY_CONTAINER_ID" \
              --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'
          )"

          EXPECTED_MOUNT="$ACME_WEBROOT -> /var/www/certbot"

          if ! grep -Fxq "$EXPECTED_MOUNT" <<< "$MOUNTS"; then

            echo "ERROR: ACME webroot mount is missing."

            echo "$MOUNTS"

            exit 1
          fi

          echo "ACME webroot volume verified."

          # ------------------------------------------------
          # 23. Verify staging HTTP endpoint
          # ------------------------------------------------

          echo "========================================"
          echo "Checking staging HTTP endpoint"
          echo "========================================"

          GATEWAY_READY=false

          for attempt in $(seq 1 15); do

            HTTP_STATUS="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 5 \
                http://127.0.0.1/ || true
            )"

            echo "Gateway HTTP status: $HTTP_STATUS ($attempt/15)"

            case "$HTTP_STATUS" in
              2??|3??)
                GATEWAY_READY=true
                break
                ;;
            esac

            sleep 2
          done

          if [ "$GATEWAY_READY" != "true" ]; then

            echo "ERROR: Staging HTTP endpoint is unavailable."

            docker compose \
              -p my-next-gateway \
              -f "$SOURCE_DIR/docker/compose.gateway.yml" \
              logs --tail 100 nginx

            exit 1
          fi

          echo "Staging HTTP endpoint is responding."

          # ------------------------------------------------
          # 24. Create temporary ACME test challenge
          # ------------------------------------------------

          echo "========================================"
          echo "Creating temporary ACME challenge"
          echo "========================================"

          # Remove any previous test file.

          docker run \
            --rm \
            --entrypoint sh \
            --volume "$ACME_WEBROOT:/webroot" \
            nginx:1.28-alpine \
            -c 'rm -f /webroot/.well-known/acme-challenge/deployment-check'

          # Create a fresh test file using Docker root.
          # No interactive sudo is required.

          docker run \
            --rm \
            --entrypoint sh \
            --volume "$ACME_WEBROOT:/webroot" \
            nginx:1.28-alpine \
            -c 'printf "%s" "acme-test-success" > /webroot/.well-known/acme-challenge/deployment-check && chmod 644 /webroot/.well-known/acme-challenge/deployment-check'

          # ------------------------------------------------
          # 25. Verify challenge file inside Nginx
          # ------------------------------------------------

          echo "Verifying challenge file inside Nginx..."

          CONTAINER_RESPONSE="$(
            docker exec "$GATEWAY_CONTAINER_ID" \
              cat /var/www/certbot/.well-known/acme-challenge/deployment-check
          )"

          if [ "$CONTAINER_RESPONSE" != "$EXPECTED_RESPONSE" ]; then

            echo "ERROR: Nginx cannot read the ACME challenge file."

            exit 1
          fi

          echo "ACME challenge file is accessible inside Nginx."

          # ------------------------------------------------
          # 26. Verify local HTTP-01 endpoint
          # ------------------------------------------------

          echo "========================================"
          echo "Testing local HTTP-01 endpoint"
          echo "========================================"

          ACTUAL_RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              http://127.0.0.1/.well-known/acme-challenge/deployment-check
          )"

          if [ "$ACTUAL_RESPONSE" != "$EXPECTED_RESPONSE" ]; then

            echo "ERROR: Local HTTP-01 verification failed."

            echo "Received: $ACTUAL_RESPONSE"

            exit 1
          fi

          echo "Local HTTP-01 verification successful."

          # ------------------------------------------------
          # 27. Display deployment status
          # ------------------------------------------------

          echo ""
          echo "========================================"
          echo "STAGING APPLICATION STATUS"
          echo "========================================"

          docker compose \
            -p my-next-staging \
            -f "$SOURCE_DIR/docker/compose.yml" \
            -f "$SOURCE_DIR/docker/compose.staging.yml" \
            ps

          echo ""
          echo "========================================"
          echo "NGINX GATEWAY STATUS"
          echo "========================================"

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            ps

          echo ""
          echo "========================================"
          echo "STAGING DEPLOYMENT COMPLETED"
          echo "========================================"

          echo "Application: http://196.190.216.41"
          echo "Gateway:     my-next-gateway"
          echo "Image:       $IMAGE"

          REMOTE

      # --------------------------------------------------
      # 6. Verify public ACME HTTP-01 endpoint
      # --------------------------------------------------

      - name: Verify public ACME HTTP-01 endpoint
        run: |
          set -Eeuo pipefail

          URL="http://${STAGING_PUBLIC_IP}/.well-known/acme-challenge/${ACME_TEST_TOKEN}"

          EXPECTED_RESPONSE="$ACME_TEST_RESPONSE"

          RESPONSE_FILE="$RUNNER_TEMP/acme-public-response.txt"

          echo "========================================"
          echo "Testing public ACME HTTP-01 endpoint"
          echo "========================================"

          PUBLIC_READY=false

          for attempt in $(seq 1 10); do

            HTTP_STATUS="$(
              curl \
                --noproxy '*' \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out '%{http_code}' \
                --connect-timeout 5 \
                --max-time 10 \
                "$URL" 2>/dev/null || true
            )"

            ACTUAL_RESPONSE="$(cat "$RESPONSE_FILE" 2>/dev/null || true)"

            echo "Public HTTP status: $HTTP_STATUS ($attempt/10)"

            if [ "$HTTP_STATUS" = "200" ] && \
               [ "$ACTUAL_RESPONSE" = "$EXPECTED_RESPONSE" ]; then

              PUBLIC_READY=true

              break
            fi

            echo "Public ACME verification not successful yet."

            sleep 3
          done

          if [ "$PUBLIC_READY" != "true" ]; then

            echo "ERROR: Public ACME HTTP-01 verification failed."

            echo "URL: $URL"
            echo "HTTP status: $HTTP_STATUS"
            echo "Response: $ACTUAL_RESPONSE"

            exit 1
          fi

          echo "========================================"
          echo "PUBLIC ACME HTTP-01 VERIFIED"
          echo "========================================"

          echo "Public IP: $STAGING_PUBLIC_IP"
          echo "HTTP status: 200"
          echo "Challenge response: verified"

      # --------------------------------------------------
      # 7. Always clean up temporary ACME test file
      # --------------------------------------------------

      - name: Clean up temporary ACME challenge
        if: always()
        continue-on-error: true
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "Cleaning temporary ACME test file"
          echo "========================================"

          if [ ! -f ~/.ssh/id_ed25519 ]; then
            echo "SSH key unavailable. Skipping remote cleanup."
            exit 0
          fi

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'docker run --rm --entrypoint sh --volume /opt/adama-revenue/web_app/certificates/www:/webroot nginx:1.28-alpine -c "rm -f /webroot/.well-known/acme-challenge/deployment-check"'

          echo "Temporary ACME test file removed."
