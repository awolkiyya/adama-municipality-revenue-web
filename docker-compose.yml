services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: frontend-app

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: Africa/Addis_Ababa

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - frontend-network


  nginx:
    image: nginx:alpine

    container_name: frontend-nginx

    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Nginx configuration
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      # Let's Encrypt certificates
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # Let's Encrypt ACME challenge
      - ./certbot/www:/var/www/certbot:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - frontend-network


networks:
  frontend-network:
    driver: bridge