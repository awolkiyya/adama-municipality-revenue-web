
name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      STAGING_PUBLIC_IP: "196.190.216.41"
      ACME_TEST_TOKEN: "deployment-check"
      ACME_TEST_RESPONSE: "acme-test-success"

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Configure SSH
      # --------------------------------------------------

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configured successfully."

      # --------------------------------------------------
      # 3. Validate and package source
      # --------------------------------------------------

      - name: Package application source
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "VALIDATING DEPLOYMENT SOURCE"
          echo "========================================"

          test -f docker/Dockerfile
          test -f docker/compose.yml
          test -f docker/compose.staging.yml

          echo "Packaging staging source..."

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='coverage' \
            --exclude='certificates' \
            --exclude='nginx' \
            --exclude='docker/compose.gateway.yml' \
            -czf "$RUNNER_TEMP/staging-source.tar.gz" .

          test -s "$RUNNER_TEMP/staging-source.tar.gz"

          tar -tzf "$RUNNER_TEMP/staging-source.tar.gz" > /dev/null

          if tar -tzf "$RUNNER_TEMP/staging-source.tar.gz" |
            grep -Eq '(^|/)nginx/|(^|/)compose\.gateway\.yml$'; then
            echo "ERROR: Shared gateway files must not be included."
            exit 1
          fi

          echo "Source package created successfully."
          echo "Commit: $GITHUB_SHA"

      # --------------------------------------------------
      # 4. Transfer source to staging server
      # --------------------------------------------------

      - name: Transfer source code
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"

          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/staging-source.tar.gz" \
            "$STAGING_USER@$STAGING_HOST:/tmp/adama-staging-source.tar.gz"

          echo "Source transferred successfully."

      # --------------------------------------------------
      # 5. Build and deploy staging application
      # --------------------------------------------------

      - name: Build and deploy staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'bash -s --' "$GITHUB_SHA" <<'REMOTE'

          set -Eeuo pipefail

          # ------------------------------------------------
          # Deployment configuration
          # ------------------------------------------------

          GIT_COMMIT="${1:?Git commit SHA is required}"

          APP_ROOT="/opt/adama-revenue/web_app"
          SOURCE_DIR="$APP_ROOT/source-staging"
          ENV_FILE="$APP_ROOT/.env.staging"
          ARCHIVE="/tmp/adama-staging-source.tar.gz"

          IMAGE="adama-revenue-web:staging"
          RELEASE_IMAGE="adama-revenue-web:staging-$GIT_COMMIT"

          GATEWAY_COMPOSE_FILE="$APP_ROOT/gateway/docker/compose.gateway.yml"

          ACME_WEBROOT="$APP_ROOT/certificates/www"
          ACME_CHALLENGE_DIR="$ACME_WEBROOT/.well-known/acme-challenge"

          COMPOSE_PROJECT="my-next-staging"
          GATEWAY_PROJECT="my-next-gateway"

          COMPOSE_FILE="$SOURCE_DIR/docker/compose.yml"
          STAGING_COMPOSE_FILE="$SOURCE_DIR/docker/compose.staging.yml"

          export IMAGE

          cd "$APP_ROOT"

          echo "========================================"
          echo "STAGING DEPLOYMENT"
          echo "========================================"

          echo "Server: $(hostname)"
          echo "Deployment user: $(id)"
          echo "Commit: $GIT_COMMIT"
          echo "Source directory: $SOURCE_DIR"
          echo "Stable image: $IMAGE"
          echo "Release image: $RELEASE_IMAGE"

          # ------------------------------------------------
          # 6. Verify deployment prerequisites
          # ------------------------------------------------

          echo "========================================"
          echo "CHECKING DEPLOYMENT PREREQUISITES"
          echo "========================================"

          test -s "$ENV_FILE"
          test -s "$ARCHIVE"
          test -s "$GATEWAY_COMPOSE_FILE"

          docker --version
          docker compose version

          tar -tzf "$ARCHIVE" > /dev/null

          # ------------------------------------------------
          # 7. Initialize persistent ACME webroot
          # ------------------------------------------------

          echo "========================================"
          echo "INITIALIZING ACME HTTP-01 WEBROOT"
          echo "========================================"

          mkdir -p "$ACME_CHALLENGE_DIR"

          echo "ACME webroot:"
          readlink -f "$ACME_WEBROOT"

          ls -ld "$ACME_WEBROOT"
          ls -ld "$ACME_WEBROOT/.well-known"
          ls -ld "$ACME_CHALLENGE_DIR"

          # ------------------------------------------------
          # 8. Extract and validate source
          # ------------------------------------------------

          echo "========================================"
          echo "EXTRACTING STAGING SOURCE"
          echo "========================================"

          EXTRACT_DIR="$(mktemp -d /tmp/adama-staging-source.XXXXXX)"

          DEPLOY_STARTED=false
          DEPLOY_SUCCESS=false
          PREVIOUS_IMAGE_ID=""

          cleanup_deployment() {
            rm -rf -- "$EXTRACT_DIR"
            rm -f -- "$ARCHIVE"
          }

          rollback_deployment() {
            if [ "$DEPLOY_STARTED" = "true" ] &&
               [ "$DEPLOY_SUCCESS" != "true" ] &&
               [ -n "$PREVIOUS_IMAGE_ID" ]; then

              echo "========================================"
              echo "DEPLOYMENT FAILED - ROLLING BACK"
              echo "========================================"

              docker tag "$PREVIOUS_IMAGE_ID" "$IMAGE"

              docker compose \
                -p "$COMPOSE_PROJECT" \
                -f "$COMPOSE_FILE" \
                -f "$STAGING_COMPOSE_FILE" \
                up -d \
                --no-build \
                --pull never \
                --force-recreate \
                app || {
                  echo "ERROR: Automatic rollback failed."
                  return 1
                }

              echo "Previous application image restored."
            fi
          }

          deployment_exit() {
            EXIT_CODE=$?

            trap - EXIT

            if [ "$EXIT_CODE" -ne 0 ]; then
              rollback_deployment || true
            fi

            cleanup_deployment

            exit "$EXIT_CODE"
          }

          trap deployment_exit EXIT

          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR"

          test -f "$EXTRACT_DIR/docker/Dockerfile"
          test -f "$EXTRACT_DIR/docker/compose.yml"
          test -f "$EXTRACT_DIR/docker/compose.staging.yml"

          # ------------------------------------------------
          # 9. Update staging source
          # ------------------------------------------------

          echo "========================================"
          echo "UPDATING STAGING SOURCE"
          echo "========================================"

          mkdir -p "$SOURCE_DIR"

          find "$SOURCE_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf -- {} +

          cp -a "$EXTRACT_DIR/." "$SOURCE_DIR/"

          rm -rf -- "$EXTRACT_DIR"

          # ------------------------------------------------
          # 10. Read staging API URL
          # ------------------------------------------------

          echo "========================================"
          echo "READING STAGING ENVIRONMENT"
          echo "========================================"

          NEXT_PUBLIC_API_URL="$(
            sed -n 's/^NEXT_PUBLIC_API_URL=//p' "$ENV_FILE" |
            tail -n 1 |
            sed 's/^["'\'']//; s/["'\'']$//'
          )"

          test -n "$NEXT_PUBLIC_API_URL"

          case "$NEXT_PUBLIC_API_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: Invalid NEXT_PUBLIC_API_URL."
              exit 1
              ;;
          esac

          echo "Staging API URL validated."

          # ------------------------------------------------
          # 11. Validate Compose configuration
          # ------------------------------------------------

          echo "========================================"
          echo "VALIDATING COMPOSE CONFIGURATION"
          echo "========================================"

          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f "$COMPOSE_FILE" \
            -f "$STAGING_COMPOSE_FILE" \
            config -q

          # Ensure the app service uses the exact image
          # that this workflow builds and deploys.

          CONFIGURED_APP_IMAGE="$(
            docker compose \
              -p "$COMPOSE_PROJECT" \
              -f "$COMPOSE_FILE" \
              -f "$STAGING_COMPOSE_FILE" \
              config --format json |
            python3 -c '
          import json
          import sys

          config = json.load(sys.stdin)
          app = config.get("services", {}).get("app")

          if not app:
              raise SystemExit("ERROR: Compose service app was not found.")

          print(app.get("image", ""))
          '
          )"

          if [ "$CONFIGURED_APP_IMAGE" != "$IMAGE" ]; then
            echo "ERROR: Compose app image does not match workflow image."
            echo "Expected: $IMAGE"
            echo "Actual:   $CONFIGURED_APP_IMAGE"
            exit 1
          fi

          echo "Compose application image verified: $IMAGE"

          # ------------------------------------------------
          # 12. Build unique release image
          # ------------------------------------------------

          echo "========================================"
          echo "BUILDING STAGING DOCKER IMAGE"
          echo "========================================"

          docker build \
            --pull \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --label "org.opencontainers.image.revision=$GIT_COMMIT" \
            --label "org.opencontainers.image.source=adama-revenue-web" \
            --label "org.opencontainers.image.version=$GIT_COMMIT" \
            -f "$SOURCE_DIR/docker/Dockerfile" \
            -t "$RELEASE_IMAGE" \
            "$SOURCE_DIR"

          echo "Release image built successfully."

          # ------------------------------------------------
          # 13. Verify release image metadata
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING RELEASE IMAGE"
          echo "========================================"

          BUILT_COMMIT="$(
            docker image inspect "$RELEASE_IMAGE" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          if [ "$BUILT_COMMIT" != "$GIT_COMMIT" ]; then
            echo "ERROR: Built image commit does not match deployment commit."
            exit 1
          fi

          echo "Built image commit verified: $BUILT_COMMIT"

          # ------------------------------------------------
          # 14. Preserve previous image for rollback
          # ------------------------------------------------

          echo "========================================"
          echo "PREPARING DEPLOYMENT ROLLBACK"
          echo "========================================"

          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            PREVIOUS_IMAGE_ID="$(
              docker image inspect "$IMAGE" --format '{{.Id}}'
            )"

            echo "Previous image found: $PREVIOUS_IMAGE_ID"
          else
            echo "No previous staging image found."
          fi

          # Tag the new immutable release as the stable
          # image expected by Docker Compose.

          docker tag "$RELEASE_IMAGE" "$IMAGE"

          NEW_IMAGE_ID="$(
            docker image inspect "$IMAGE" --format '{{.Id}}'
          )"

          echo "New staging image: $NEW_IMAGE_ID"

          # ------------------------------------------------
          # 15. Deploy Next.js application
          # ------------------------------------------------

          echo "========================================"
          echo "DEPLOYING STAGING APPLICATION"
          echo "========================================"

          DEPLOY_STARTED=true

          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f "$COMPOSE_FILE" \
            -f "$STAGING_COMPOSE_FILE" \
            up -d \
            --no-build \
            --pull never \
            --remove-orphans \
            --force-recreate

          # ------------------------------------------------
          # 16. Verify deployed container and image
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING DEPLOYED CONTAINER"
          echo "========================================"

          CONTAINER_ID="$(
            docker compose \
              -p "$COMPOSE_PROJECT" \
              -f "$COMPOSE_FILE" \
              -f "$STAGING_COMPOSE_FILE" \
              ps -q app
          )"

          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: Staging application container was not found."
            exit 1
          fi

          DEPLOYED_IMAGE_ID="$(
            docker inspect "$CONTAINER_ID" --format '{{.Image}}'
          )"

          if [ "$DEPLOYED_IMAGE_ID" != "$NEW_IMAGE_ID" ]; then
            echo "ERROR: Running container is not using the newly built image."
            echo "Expected: $NEW_IMAGE_ID"
            echo "Actual:   $DEPLOYED_IMAGE_ID"
            exit 1
          fi

          DEPLOYED_COMMIT="$(
            docker inspect "$CONTAINER_ID" \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          )"

          if [ "$DEPLOYED_COMMIT" != "$GIT_COMMIT" ]; then
            echo "ERROR: Running container has an unexpected commit."
            echo "Expected: $GIT_COMMIT"
            echo "Actual:   $DEPLOYED_COMMIT"
            exit 1
          fi

          echo "Running container commit verified: $DEPLOYED_COMMIT"

          # ------------------------------------------------
          # 17. Wait for application health
          # ------------------------------------------------

          echo "========================================"
          echo "WAITING FOR APPLICATION HEALTH"
          echo "========================================"

          HEALTHY=false

          for attempt in $(seq 1 30); do

            STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                "$CONTAINER_ID"
            )"

            echo "Application health: $STATUS ($attempt/30)"

            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ] ||
               [ "$STATUS" = "no-healthcheck" ]; then
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Staging application health check failed."
            docker logs --tail 100 "$CONTAINER_ID"
            exit 1
          fi

          echo "Staging application is healthy."

          # ------------------------------------------------
          # 18. Verify staging Docker network
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING STAGING DOCKER NETWORK"
          echo "========================================"

          docker network inspect "${COMPOSE_PROJECT}_app-network" > /dev/null

          echo "Staging Docker network verified."

          # ------------------------------------------------
          # 19. Identify shared Nginx gateway
          # ------------------------------------------------

          echo "========================================"
          echo "CHECKING SHARED NGINX GATEWAY"
          echo "========================================"

          GATEWAY_CONTAINER_ID="$(
            docker compose \
              -p "$GATEWAY_PROJECT" \
              -f "$GATEWAY_COMPOSE_FILE" \
              ps -q nginx
          )"

          if [ -z "$GATEWAY_CONTAINER_ID" ]; then
            echo "ERROR: Shared Nginx gateway container was not found."
            echo "This workflow does not deploy or recreate the gateway."
            exit 1
          fi

          # ------------------------------------------------
          # 20. Verify live Nginx configuration
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING LIVE NGINX CONFIGURATION"
          echo "========================================"

          docker exec "$GATEWAY_CONTAINER_ID" nginx -t

          LIVE_NGINX_CONFIG="$(
            docker exec "$GATEWAY_CONTAINER_ID" nginx -T 2>&1
          )"

          if ! grep -Fq \
            'location ^~ /.well-known/acme-challenge/' \
            <<< "$LIVE_NGINX_CONFIG"; then

            echo "ERROR: ACME location is missing from live Nginx."
            exit 1
          fi

          echo "Live Nginx ACME configuration verified."

          # ------------------------------------------------
          # 21. Verify ACME webroot volume
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING ACME WEBROOT VOLUME"
          echo "========================================"

          ACTUAL_MOUNT_SOURCE="$(
            docker inspect "$GATEWAY_CONTAINER_ID" \
              --format '{{range .Mounts}}{{if eq .Destination "/var/www/certbot"}}{{.Source}}{{end}}{{end}}'
          )"

          EXPECTED_MOUNT_SOURCE="$(readlink -f "$ACME_WEBROOT")"

          if [ "$(readlink -f "$ACTUAL_MOUNT_SOURCE")" != "$EXPECTED_MOUNT_SOURCE" ]; then
            echo "ERROR: ACME webroot mount is incorrect."
            echo "Expected: $EXPECTED_MOUNT_SOURCE"
            echo "Actual:   $ACTUAL_MOUNT_SOURCE"
            exit 1
          fi

          echo "ACME webroot volume verified."

          # ------------------------------------------------
          # 22. Verify staging HTTP endpoint
          # ------------------------------------------------

          echo "========================================"
          echo "CHECKING STAGING HTTP ENDPOINT"
          echo "========================================"

          GATEWAY_READY=false

          for attempt in $(seq 1 15); do

            HTTP_STATUS="$(
              curl \
                --noproxy '*' \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 3 \
                --max-time 5 \
                http://127.0.0.1/ || true
            )"

            echo "Gateway HTTP status: $HTTP_STATUS ($attempt/15)"

            case "$HTTP_STATUS" in
              2??|3??)
                GATEWAY_READY=true
                break
                ;;
            esac

            sleep 2
          done

          if [ "$GATEWAY_READY" != "true" ]; then
            echo "ERROR: Staging HTTP endpoint is unavailable."

            docker compose \
              -p "$GATEWAY_PROJECT" \
              -f "$GATEWAY_COMPOSE_FILE" \
              logs --tail 100 nginx

            exit 1
          fi

          echo "Staging HTTP endpoint is responding."

          # ------------------------------------------------
          # 23. Mark deployment successful
          # ------------------------------------------------

          DEPLOY_SUCCESS=true

          # ------------------------------------------------
          # 24. Display deployment status
          # ------------------------------------------------

          echo ""
          echo "========================================"
          echo "STAGING APPLICATION STATUS"
          echo "========================================"

          docker compose \
            -p "$COMPOSE_PROJECT" \
            -f "$COMPOSE_FILE" \
            -f "$STAGING_COMPOSE_FILE" \
            ps

          echo ""
          echo "========================================"
          echo "SHARED NGINX GATEWAY STATUS"
          echo "========================================"

          docker compose \
            -p "$GATEWAY_PROJECT" \
            -f "$GATEWAY_COMPOSE_FILE" \
            ps

          echo ""
          echo "========================================"
          echo "STAGING DEPLOYMENT COMPLETED"
          echo "========================================"

          echo "Application: http://196.190.216.41"
          echo "Commit:      $GIT_COMMIT"
          echo "Image:       $IMAGE"
          echo "Release:     $RELEASE_IMAGE"
          echo "Gateway:     $GATEWAY_PROJECT (not modified)"

          REMOTE

      # --------------------------------------------------
      # 6. Verify public ACME HTTP-01 endpoint
      # --------------------------------------------------

      - name: Verify public ACME HTTP-01 endpoint
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          URL="http://${STAGING_PUBLIC_IP}/.well-known/acme-challenge/${ACME_TEST_TOKEN}"

          EXPECTED_RESPONSE="$ACME_TEST_RESPONSE"
          RESPONSE_FILE="$RUNNER_TEMP/acme-public-response.txt"

          HTTP_STATUS="000"
          ACTUAL_RESPONSE=""

          echo "========================================"
          echo "CREATING AND VERIFYING REMOTE ACME CHALLENGE"
          echo "========================================"

          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'bash -s --' "$ACME_TEST_TOKEN" "$ACME_TEST_RESPONSE" <<'REMOTE_CHECK'

          set -Eeuo pipefail

          TOKEN="${1:?ACME token is required}"
          EXPECTED="${2:?ACME response is required}"

          APP_ROOT="/opt/adama-revenue/web_app"
          WEBROOT="$APP_ROOT/certificates/www"
          CHALLENGE_DIR="$WEBROOT/.well-known/acme-challenge"

          FILE="$CHALLENGE_DIR/$TOKEN"
          TEMP_FILE="$CHALLENGE_DIR/.${TOKEN}.tmp.$$"

          if [[ ! "$TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "ERROR: Invalid ACME test token."
            exit 1
          fi

          if [ -z "$EXPECTED" ]; then
            echo "ERROR: Expected ACME response is empty."
            exit 1
          fi

          echo "Remote server: $(hostname)"
          echo "Deployment user: $(id)"
          echo "Webroot: $WEBROOT"

          mkdir -p "$CHALLENGE_DIR"

          if [ ! -w "$CHALLENGE_DIR" ]; then
            echo "ERROR: Deployment user cannot write to ACME directory."
            namei -l "$CHALLENGE_DIR" || true
            exit 1
          fi

          umask 022

          printf '%s' "$EXPECTED" > "$TEMP_FILE"
          chmod 644 "$TEMP_FILE"
          mv -f -- "$TEMP_FILE" "$FILE"

          # ------------------------------------------------
          # Verify remote challenge file
          # ------------------------------------------------

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Remote challenge file is empty or missing."
            exit 1
          fi

          if ! printf '%s' "$EXPECTED" | cmp -s - "$FILE"; then
            echo "ERROR: Remote challenge content does not match."
            exit 1
          fi

          echo "Remote challenge file verified."

          stat "$FILE"

          # ------------------------------------------------
          # Verify Nginx container sees the challenge file
          # ------------------------------------------------

          GATEWAY_COMPOSE_FILE="$APP_ROOT/gateway/docker/compose.gateway.yml"

          GATEWAY_CONTAINER_ID="$(
            docker compose \
              -p my-next-gateway \
              -f "$GATEWAY_COMPOSE_FILE" \
              ps -q nginx
          )"

          if [ -z "$GATEWAY_CONTAINER_ID" ]; then
            echo "ERROR: Nginx gateway container was not found."
            exit 1
          fi

          CONTAINER_FILE="/var/www/certbot/.well-known/acme-challenge/$TOKEN"

          if ! docker exec "$GATEWAY_CONTAINER_ID" test -s "$CONTAINER_FILE"; then
            echo "ERROR: Challenge file is missing inside Nginx."
            exit 1
          fi

          CONTAINER_RESPONSE="$(
            docker exec "$GATEWAY_CONTAINER_ID" cat "$CONTAINER_FILE"
          )"

          if [ "$CONTAINER_RESPONSE" != "$EXPECTED" ]; then
            echo "ERROR: Nginx challenge content does not match."
            exit 1
          fi

          echo "Nginx challenge file verified."

          # ------------------------------------------------
          # Verify local HTTP-01 endpoint
          # ------------------------------------------------

          LOCAL_RESPONSE="$(
            curl \
              --noproxy '*' \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 3 \
              --max-time 10 \
              "http://127.0.0.1/.well-known/acme-challenge/$TOKEN"
          )"

          if [ "$LOCAL_RESPONSE" != "$EXPECTED" ]; then
            echo "ERROR: Local HTTP-01 verification failed."
            exit 1
          fi

          echo "Local HTTP-01 endpoint verified."

          # ------------------------------------------------
          # Final remote file verification
          # ------------------------------------------------

          if [ ! -s "$FILE" ]; then
            echo "ERROR: Remote challenge file disappeared."
            exit 1
          fi

          if ! printf '%s' "$EXPECTED" | cmp -s - "$FILE"; then
            echo "ERROR: Remote challenge file changed."
            exit 1
          fi

          echo "Remote challenge file confirmed."

          REMOTE_CHECK

          # ------------------------------------------------
          # Verify public HTTP-01 endpoint
          # ------------------------------------------------

          echo "========================================"
          echo "TESTING PUBLIC ACME HTTP-01 ENDPOINT"
          echo "========================================"

          echo "URL: $URL"

          PUBLIC_READY=false

          for attempt in $(seq 1 15); do

            : > "$RESPONSE_FILE"

            HTTP_STATUS="$(
              curl \
                --noproxy '*' \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out '%{http_code}' \
                --connect-timeout 5 \
                --max-time 10 \
                "$URL" 2>/dev/null || true
            )"

            ACTUAL_RESPONSE="$(cat "$RESPONSE_FILE" 2>/dev/null || true)"

            echo "Public HTTP status: $HTTP_STATUS ($attempt/15)"

            if [ "$HTTP_STATUS" = "200" ] &&
               [ "$ACTUAL_RESPONSE" = "$EXPECTED_RESPONSE" ]; then

              PUBLIC_READY=true
              break
            fi

            sleep 3
          done

          if [ "$PUBLIC_READY" != "true" ]; then
            echo "========================================"
            echo "PUBLIC ACME VERIFICATION FAILED"
            echo "========================================"

            echo "URL: $URL"
            echo "HTTP status: $HTTP_STATUS"
            echo "Expected: $EXPECTED_RESPONSE"
            echo "Received: $ACTUAL_RESPONSE"

            exit 1
          fi

          echo "========================================"
          echo "PUBLIC ACME HTTP-01 VERIFIED"
          echo "========================================"

          echo "Public IP: $STAGING_PUBLIC_IP"
          echo "HTTP status: 200"
          echo "Challenge response: verified"

      # --------------------------------------------------
      # 7. Always clean up temporary ACME challenge
      # --------------------------------------------------

      - name: Clean up temporary ACME challenge
        if: always()
        continue-on-error: true
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "CLEANING TEMPORARY ACME CHALLENGE"
          echo "========================================"

          if [ ! -f "$HOME/.ssh/id_ed25519" ]; then
            echo "SSH key unavailable. Skipping remote cleanup."
            exit 0
          fi

          if [ -z "${STAGING_HOST:-}" ] ||
             [ -z "${STAGING_USER:-}" ]; then
            echo "SSH connection settings unavailable. Skipping cleanup."
            exit 0
          fi

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'bash -s --' "$ACME_TEST_TOKEN" <<'REMOTE_CLEANUP'

          set -Eeuo pipefail

          TOKEN="${1:?ACME token is required}"

          if [[ ! "$TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "ERROR: Invalid ACME cleanup token."
            exit 1
          fi

          FILE="/opt/adama-revenue/web_app/certificates/www/.well-known/acme-challenge/$TOKEN"

          if [ -f "$FILE" ]; then
            rm -f -- "$FILE"
            echo "Temporary ACME challenge removed."
          else
            echo "Temporary ACME challenge does not exist."
          fi

          REMOTE_CLEANUP

          echo "ACME cleanup completed."
