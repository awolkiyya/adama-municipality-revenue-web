
# ============================================================
# ADAMA MUNICIPAL REVENUE
# NGINX GATEWAY - STAGING HTTP / PRODUCTION HTTPS
# ============================================================

# Docker embedded DNS resolver.
# Required for dynamic resolution of Docker service names.
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket connection mapping.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================================
# UPSTREAM APPLICATIONS
# ============================================================

upstream staging_backend {
    zone staging_backend 64k;
    least_conn;

    server staging-app:3000 resolve;
}

upstream production_backend {
    zone production_backend 64k;
    least_conn;

    server production-app:3000 resolve;
}

# ============================================================
# HTTP - STAGING
# http://196.190.216.41
# ============================================================

server {
    listen 80;
    server_name 196.190.216.41;

    # --------------------------------------------------------
    # Let's Encrypt HTTP-01 challenge
    # --------------------------------------------------------

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # Staging application
    # --------------------------------------------------------

    location / {
        proxy_pass http://staging_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ============================================================
# HTTPS - PRODUCTION
# https://196.190.216.41
# ============================================================

server {
    listen 443 ssl;
    server_name 196.190.216.41;

    # --------------------------------------------------------
    # Production Let's Encrypt certificate
    # --------------------------------------------------------

    ssl_certificate
        /etc/letsencrypt/live/196.190.216.41/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/196.190.216.41/privkey.pem;

    # --------------------------------------------------------
    # TLS configuration
    # --------------------------------------------------------

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --------------------------------------------------------
    # Production application
    # --------------------------------------------------------

    location / {
        proxy_pass http://production_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
