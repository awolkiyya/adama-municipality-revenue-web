resolver 127.0.0.11 valid=10s ipv6=off;

upstream production_backend {
    zone production_backend 64k;
    least_conn;
    server production-app:3000 resolve;
}

upstream staging_backend {
    zone staging_backend 64k;
    least_conn;
    server staging-app:3000 resolve;
}

# Production HTTP
server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://production_backend;
        include /etc/nginx/proxy_params;
    }
}

# Production HTTPS
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/your-certificate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-certificate/privkey.pem;

    location / {
        proxy_pass http://production_backend;
        include /etc/nginx/proxy_params;
    }
}

# Staging HTTP
server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass http://staging_backend;
        include /etc/nginx/proxy_params;
    }
}

# Staging HTTPS
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/your-certificate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-certificate/privkey.pem;

    location / {
        proxy_pass http://staging_backend;
        include /etc/nginx/proxy_params;
    }
}