
---
# ============================================================
# ADAMA MUNICIPAL REVENUE - CERTIFICATE ISSUANCE
# LET'S ENCRYPT DOMAIN SAN CERTIFICATE
# ============================================================

# ------------------------------------------------------------
# 1. Validate domain configuration
# ------------------------------------------------------------

- name: Validate SSL certificate configuration
  ansible.builtin.assert:
    that:
      - ssl_certificate_name | length > 0
      - ssl_certificate_domains | length >= 1
      - ssl_certificate_domains | unique | length == ssl_certificate_domains | length
      - ssl_email | length > 0
      - "'@' in ssl_email"
      - ssl_certificate_name == ssl_certificate_domains[0]
    fail_msg: >-
      Invalid SSL configuration. Configure a certificate name,
      unique domain names, and a valid email address.
      The certificate name must match the first domain.

# ------------------------------------------------------------
# 2. Select ACME server
# ------------------------------------------------------------

- name: Select ACME server
  ansible.builtin.set_fact:
    ssl_certbot_selected_server: >-
      {{
        ssl_certbot_staging_server
        if ssl_certbot_staging | bool
        else ssl_certbot_production_server
      }}

# ------------------------------------------------------------
# 3. Inspect existing certificate and private key
# ------------------------------------------------------------

- name: Check existing certificate
  ansible.builtin.stat:
    path: "{{ ssl_certificate_fullchain }}"
    follow: true
  register: ssl_existing_certificate

- name: Check existing private key
  ansible.builtin.stat:
    path: "{{ ssl_certificate_private_key }}"
    follow: true
  register: ssl_existing_private_key

# ------------------------------------------------------------
# 4. Check existing certificate expiration
# ------------------------------------------------------------

- name: Check existing certificate expiration
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ ssl_certificate_fullchain }}"
      - -checkend
      - "0"
      - -noout
  register: ssl_certificate_expiration
  changed_when: false
  failed_when: false
  when:
    - ssl_existing_certificate.stat.exists
    - ssl_existing_certificate.stat.isreg

# ------------------------------------------------------------
# 5. Verify existing certificate domains
# ------------------------------------------------------------

- name: Verify existing certificate domains
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ ssl_certificate_fullchain }}"
      - -checkhost
      - "{{ item }}"
      - -noout
  loop: "{{ ssl_certificate_domains }}"
  register: ssl_existing_domain_checks
  changed_when: false
  failed_when: false
  when:
    - ssl_existing_certificate.stat.exists
    - ssl_existing_certificate.stat.isreg

# ------------------------------------------------------------
# 6. Extract existing certificate public key
# ------------------------------------------------------------

- name: Extract existing certificate public key
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ ssl_certificate_fullchain }}"
      - -pubkey
      - -noout
  register: ssl_existing_cert_public_key
  changed_when: false
  failed_when: false
  when:
    - ssl_existing_certificate.stat.exists
    - ssl_existing_certificate.stat.isreg

# ------------------------------------------------------------
# 7. Extract existing private key public component
# ------------------------------------------------------------

- name: Extract existing private key public component
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -in
      - "{{ ssl_certificate_private_key }}"
      - -pubout
  register: ssl_existing_private_public_key
  changed_when: false
  failed_when: false
  when:
    - ssl_existing_private_key.stat.exists
    - ssl_existing_private_key.stat.isreg

# ------------------------------------------------------------
# 8. Determine existing certificate validity
# ------------------------------------------------------------

- name: Determine existing certificate validity
  ansible.builtin.set_fact:
    ssl_existing_certificate_valid: >-
      {{
        (ssl_existing_certificate.stat.exists | default(false))
        and
        (ssl_existing_certificate.stat.isreg | default(false))
        and
        (ssl_existing_private_key.stat.exists | default(false))
        and
        (ssl_existing_private_key.stat.isreg | default(false))
        and
        (ssl_certificate_expiration.rc | default(1) == 0)
        and
        (
          ssl_existing_domain_checks.results | default([])
          | length == ssl_certificate_domains | length
        )
        and
        (
          ssl_existing_domain_checks.results | default([])
          | map(attribute='rc')
          | select('equalto', 0)
          | list
          | length == ssl_certificate_domains | length
        )
        and
        (ssl_existing_cert_public_key.rc | default(1) == 0)
        and
        (ssl_existing_private_public_key.rc | default(1) == 0)
        and
        (
          ssl_existing_cert_public_key.stdout | default('')
          ==
          ssl_existing_private_public_key.stdout | default('')
        )
      }}

# ------------------------------------------------------------
# 9. Build Certbot domain arguments
# ------------------------------------------------------------

- name: Initialize Certbot domain arguments
  ansible.builtin.set_fact:
    ssl_certbot_domain_args: []

- name: Add each certificate domain to Certbot arguments
  ansible.builtin.set_fact:
    ssl_certbot_domain_args: >-
      {{ ssl_certbot_domain_args + ['-d', item] }}
  loop: "{{ ssl_certificate_domains }}"

# ------------------------------------------------------------
# 10. Issue or update certificate if necessary
# ------------------------------------------------------------

- name: Request Let's Encrypt domain SAN certificate
  ansible.builtin.command:
    argv: >-
      {{
        [
          ssl_certbot_binary,
          'certonly',
          '--non-interactive',
          '--agree-tos',
          '--no-eff-email',
          '--email',
          ssl_email,
          '--webroot',
          '--webroot-path',
          ssl_webroot_dir,
          '--cert-name',
          ssl_certificate_name,
          '--config-dir',
          ssl_certbot_effective_config_dir,
          '--work-dir',
          ssl_certbot_work_dir,
          '--logs-dir',
          ssl_certbot_logs_dir,
          '--server',
          ssl_certbot_selected_server
        ] + ssl_certbot_domain_args
      }}
  register: ssl_certbot_issue_result
  when: not (ssl_existing_certificate_valid | bool)

# ------------------------------------------------------------
# 11. Verify issued certificate exists
# ------------------------------------------------------------

- name: Verify issued certificate
  ansible.builtin.stat:
    path: "{{ ssl_certificate_fullchain }}"
    follow: true
  register: ssl_issued_certificate

- name: Verify certificate file
  ansible.builtin.assert:
    that:
      - ssl_issued_certificate.stat.exists
      - ssl_issued_certificate.stat.isreg
    fail_msg: >-
      Certificate issuance did not produce:
      {{ ssl_certificate_fullchain }}

# ------------------------------------------------------------
# 12. Verify private key exists
# ------------------------------------------------------------

- name: Verify issued private key
  ansible.builtin.stat:
    path: "{{ ssl_certificate_private_key }}"
    follow: true
  register: ssl_issued_private_key

- name: Verify private key file
  ansible.builtin.assert:
    that:
      - ssl_issued_private_key.stat.exists
      - ssl_issued_private_key.stat.isreg
    fail_msg: >-
      Certificate private key is missing:
      {{ ssl_certificate_private_key }}

# ------------------------------------------------------------
# 13. Verify certificate expiration
# ------------------------------------------------------------

- name: Verify certificate expiration
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ ssl_certificate_fullchain }}"
      - -checkend
      - "0"
      - -noout
  changed_when: false

# ------------------------------------------------------------
# 14. Verify all certificate domains
# ------------------------------------------------------------

- name: Verify final certificate domains
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ ssl_certificate_fullchain }}"
      - -checkhost
      - "{{ item }}"
      - -noout
  loop: "{{ ssl_certificate_domains }}"
  register: ssl_final_domain_checks
  changed_when: false

- name: Verify all domain checks passed
  ansible.builtin.assert:
    that:
      - ssl_final_domain_checks.results | length == ssl_certificate_domains | length
      - >-
        ssl_final_domain_checks.results
        | map(attribute='rc')
        | select('equalto', 0)
        | list
        | length == ssl_certificate_domains | length
    fail_msg: Certificate does not cover every configured domain.

# ------------------------------------------------------------
# 15. Extract final certificate public key
# ------------------------------------------------------------

- name: Extract final certificate public key
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ ssl_certificate_fullchain }}"
      - -pubkey
      - -noout
  register: ssl_final_cert_public_key
  changed_when: false

# ------------------------------------------------------------
# 16. Extract final private key public component
# ------------------------------------------------------------

- name: Extract final private key public component
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -in
      - "{{ ssl_certificate_private_key }}"
      - -pubout
  register: ssl_final_private_public_key
  changed_when: false

# ------------------------------------------------------------
# 17. Verify certificate and private key match
# ------------------------------------------------------------

- name: Verify certificate and private key match
  ansible.builtin.assert:
    that:
      - ssl_final_cert_public_key.stdout == ssl_final_private_public_key.stdout
    fail_msg: Certificate and private key do not match.

# ------------------------------------------------------------
# 18. Display certificate summary
# ------------------------------------------------------------

- name: Display certificate summary
  ansible.builtin.debug:
    msg:
      - "Certificate name: {{ ssl_certificate_name }}"
      - "Certificate domains: {{ ssl_certificate_domains | join(', ') }}"
      - "ACME environment: {{ 'Staging' if ssl_certbot_staging | bool else 'Production' }}"
      - "ACME server: {{ ssl_certbot_selected_server }}"
      - "Certificate file: {{ ssl_certificate_fullchain }}"
      - "Private key: {{ ssl_certificate_private_key }}"
      - "Existing certificate reused: {{ ssl_existing_certificate_valid }}"
      - "Domain verification: passed"
      - "Expiration verification: passed"
      - "Certificate/private key matching: passed"
