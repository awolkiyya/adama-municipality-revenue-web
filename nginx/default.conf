# =========================================================
# NGINX PRODUCTION CONFIGURATION
# Domain: trade.adamacity.gov.et
# Application: Commercial Enforcement Web
# =========================================================


# =========================================================
# HTTP — CANONICAL DOMAIN
# ACME Challenge + HTTPS Redirect
# =========================================================

server {
    listen 80;
    listen [::]:80;

    server_name trade.adamacity.gov.et;

    client_max_body_size 20M;


    # ------------------------------------------------------
    # Let's Encrypt ACME challenge
    # ------------------------------------------------------
    #
    # Certbot requires this location to remain accessible
    # over HTTP for certificate issuance/renewal.
    #
    location ^~ /.well-known/acme-challenge/ {

        root /var/www/certbot;

        default_type text/plain;

        try_files $uri =404;
    }


    # ------------------------------------------------------
    # Health check
    # ------------------------------------------------------

    location = /health {

        access_log off;

        log_not_found off;

        default_type text/plain;

        return 200 "healthy\n";
    }


    # ------------------------------------------------------
    # Redirect normal HTTP traffic to HTTPS
    # ------------------------------------------------------

    location / {

        return 301 https://trade.adamacity.gov.et$request_uri;
    }
}


# =========================================================
# HTTP — CATCH-ALL
# Redirect direct IP / unknown HTTP hosts
# to the canonical domain
# =========================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;


    # ------------------------------------------------------
    # Preserve original URI
    # ------------------------------------------------------
    #
    # Example:
    #
    # http://196.190.216.28/en
    #
    # becomes:
    #
    # https://trade.adamacity.gov.et/en
    #
    return 301 https://trade.adamacity.gov.et$request_uri;
}


# =========================================================
# HTTPS — DEFAULT CATCH-ALL
# Reject direct IP / unknown HTTPS hosts
# =========================================================

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;


    # ------------------------------------------------------
    # TLS certificate
    # ------------------------------------------------------
    #
    # This certificate is used only to complete the TLS
    # handshake for unknown HTTPS hosts.
    #
    # IMPORTANT:
    # Browsers accessing the server by IP may still report
    # a certificate-name mismatch because this certificate
    # belongs to trade.adamacity.gov.et, not the IP address.
    #
    ssl_certificate /etc/letsencrypt/live/trade.adamacity.gov.et/fullchain.pem;

    ssl_certificate_key /etc/letsencrypt/live/trade.adamacity.gov.et/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;

    ssl_session_timeout 10m;

    ssl_session_tickets off;


    # ------------------------------------------------------
    # Reject unknown HTTPS hosts
    # ------------------------------------------------------
    #
    # This prevents the application from being served through
    # the server IP or an unknown Host header.
    #
    return 444;
}


# =========================================================
# HTTPS — PRODUCTION APPLICATION
# Canonical domain only
# =========================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name trade.adamacity.gov.et;

    client_max_body_size 20M;


    # =====================================================
    # SSL / TLS
    # =====================================================

    ssl_certificate /etc/letsencrypt/live/trade.adamacity.gov.et/fullchain.pem;

    ssl_certificate_key /etc/letsencrypt/live/trade.adamacity.gov.et/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;

    ssl_session_timeout 10m;

    ssl_session_tickets off;


    # =====================================================
    # SECURITY HEADERS
    # =====================================================


    # -----------------------------------------------------
    # 1. HSTS
    # -----------------------------------------------------
    #
    # Forces browsers to use HTTPS for the canonical domain.
    #
    add_header Strict-Transport-Security "max-age=31536000" always;


    # -----------------------------------------------------
    # 2. Content Security Policy
    # -----------------------------------------------------
    #
    # Practical CSP for the Next.js application.
    #
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https://trade.adamacity.gov.et; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;


    # -----------------------------------------------------
    # 3. Cross-Origin-Opener-Policy
    # -----------------------------------------------------

    add_header Cross-Origin-Opener-Policy "same-origin" always;


    # -----------------------------------------------------
    # 4. Cross-Origin-Embedder-Policy
    # -----------------------------------------------------

    add_header Cross-Origin-Embedder-Policy "credentialless" always;


    # -----------------------------------------------------
    # 5. X-Content-Type-Options
    # -----------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;


    # -----------------------------------------------------
    # 6. X-Frame-Options
    # -----------------------------------------------------

    add_header X-Frame-Options "SAMEORIGIN" always;


    # -----------------------------------------------------
    # 7. Referrer-Policy
    # -----------------------------------------------------

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # -----------------------------------------------------
    # 8. Permissions-Policy
    # -----------------------------------------------------

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;


    # =====================================================
    # HEALTH
    # =====================================================

    location = /health {

        access_log off;

        log_not_found off;

        default_type text/plain;

        return 200 "healthy\n";
    }


    # =====================================================
    # LARAVEL API
    # =====================================================

    location /api/ {

        proxy_pass http://196.190.216.28/api/v1/;

        proxy_http_version 1.1;


        # --------------------------------------------------
        # Forward client information
        # --------------------------------------------------

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;


        # --------------------------------------------------
        # Connection
        # --------------------------------------------------

        proxy_set_header Connection "";


        # --------------------------------------------------
        # Timeouts
        # --------------------------------------------------

        proxy_connect_timeout 60s;

        proxy_send_timeout 120s;

        proxy_read_timeout 120s;


        # --------------------------------------------------
        # Disable proxy buffering
        # --------------------------------------------------

        proxy_buffering off;


        # --------------------------------------------------
        # Disable automatic proxy redirects
        # --------------------------------------------------

        proxy_redirect off;
    }


    # =====================================================
    # NEXT.JS STATIC ASSETS
    # =====================================================

    location ^~ /_next/static/ {

        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;


        # --------------------------------------------------
        # Forward client information
        # --------------------------------------------------

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;


        # --------------------------------------------------
        # Next.js static assets
        # --------------------------------------------------

        add_header Cache-Control "public, max-age=31536000, immutable" always;


        # --------------------------------------------------
        # Proxy buffering
        # --------------------------------------------------

        proxy_buffering on;

        proxy_redirect off;
    }


    # =====================================================
    # NEXT.JS APPLICATION
    # =====================================================

    location / {

        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;


        # --------------------------------------------------
        # Forward original request information
        # --------------------------------------------------

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-Forwarded-Host $host;


        # --------------------------------------------------
        # WebSocket / Next.js upgrade support
        # --------------------------------------------------

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";


        # --------------------------------------------------
        # Timeouts
        # --------------------------------------------------

        proxy_connect_timeout 60s;

        proxy_send_timeout 120s;

        proxy_read_timeout 120s;


        # --------------------------------------------------
        # Application responses
        # --------------------------------------------------

        proxy_buffering off;

        proxy_redirect off;
    }
}