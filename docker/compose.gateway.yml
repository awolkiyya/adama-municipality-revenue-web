services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped

    ports:
      # Production
      - "80:80"
      - "443:443"

      # Staging
      - "8081:8081"
      - "8443:8443"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certbot/www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

    networks:
      - staging-network
      - production-network

volumes:
  letsencrypt:

networks:
  staging-network:
    external: true
    name: my-next-staging_app-network

  production-network:
    external: true
    name: my-next-production_app-network