
name: Deploy Adama Municipal Revenue Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adama-revenue-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend to BUSA-Gonofa2
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # DEPLOY TO FRONTEND SERVER
      # ==========================================

      - name: Deploy using Docker Compose
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}

          port: 22
          timeout: 30s
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            APP_DIR="/opt/adama-revenue/web_app"

            echo "======================================"
            echo "Adama Revenue Frontend Deployment"
            echo "======================================"

            cd "$APP_DIR"

            echo "Checking deployment prerequisites..."

            command -v docker
            docker compose version

            test -f Dockerfile
            test -f docker-compose.yml
            test -f .env.production
            test -f nginx/default.conf

            echo "Updating application source..."

            git fetch origin main
            git reset --hard origin/main

            echo "Building frontend Docker image..."

            docker compose build --pull frontend

            echo "Starting frontend services..."

            docker compose up -d --remove-orphans

            echo "Validating Nginx configuration..."

            docker compose exec -T nginx nginx -t

            echo "Reloading Nginx..."

            docker compose exec -T nginx nginx -s reload

            echo "Checking frontend health..."

            HEALTHY=0

            for i in $(seq 1 30); do

              if curl -fsS http://127.0.0.1/health \
                -o /dev/null; then

                HEALTHY=1
                break

              fi

              sleep 5

            done

            if [ "$HEALTHY" -ne 1 ]; then

              echo "Deployment health check failed."

              docker compose ps

              docker compose logs --tail=100 frontend nginx

              exit 1

            fi

            echo "Checking frontend response..."

            curl -fsSI http://127.0.0.1/

            echo "======================================"
            echo "Deployment successful"
            echo "======================================"

            docker compose ps

            echo "Cleaning unused Docker build cache..."

            docker builder prune -f

            echo "Deployment completed successfully."
