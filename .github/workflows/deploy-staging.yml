name: Deploy Staging

on:
  push:
    branches:
      - staging

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      STAGING_PUBLIC_IP: "196.190.216.41"
      ACME_TEST_TOKEN: "deployment-check"
      ACME_TEST_RESPONSE: "acme-test-success"

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Configure SSH
      # --------------------------------------------------

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          echo "SSH configured successfully."

      # --------------------------------------------------
      # 3. Validate and package source
      # --------------------------------------------------

      - name: Package application source
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "VALIDATING DEPLOYMENT SOURCE"
          echo "========================================"

          test -f docker/Dockerfile
          test -f docker/compose.yml
          test -f docker/compose.staging.yml
          test -f docker/compose.gateway.yml
          test -f nginx/nginx.conf
          test -f nginx/gateway.conf

          echo "Verifying ACME HTTP-01 configuration..."

          grep -Fq \
            '/opt/adama-revenue/web_app/certificates/www:/var/www/certbot:ro' \
            docker/compose.gateway.yml

          grep -Fq \
            'location ^~ /.well-known/acme-challenge/' \
            nginx/gateway.conf

          echo "ACME source configuration verified."

          echo "Packaging staging source..."

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='coverage' \
            --exclude='certificates' \
            -czf "$RUNNER_TEMP/staging-source.tar.gz" .

          test -s "$RUNNER_TEMP/staging-source.tar.gz"

          tar -tzf "$RUNNER_TEMP/staging-source.tar.gz" > /dev/null

          echo "Source package created successfully."
          echo "Commit: $GITHUB_SHA"

      # --------------------------------------------------
      # 4. Transfer source to staging server
      # --------------------------------------------------

      - name: Transfer source code
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"

          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/staging-source.tar.gz" \
            "$STAGING_USER@$STAGING_HOST:/tmp/adama-staging-source.tar.gz"

          echo "Source transferred successfully."

      # --------------------------------------------------
      # 5. Build and deploy application + gateway
      # --------------------------------------------------

      - name: Build and deploy staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'bash -s --' "$ACME_TEST_TOKEN" "$ACME_TEST_RESPONSE" <<'REMOTE'

          set -Eeuo pipefail

          # ------------------------------------------------
          # Deployment configuration
          # ------------------------------------------------

          APP_ROOT="/opt/adama-revenue/web_app"
          SOURCE_DIR="$APP_ROOT/source-staging"
          ENV_FILE="$APP_ROOT/.env.staging"
          ARCHIVE="/tmp/adama-staging-source.tar.gz"
          IMAGE="adama-revenue-web:staging"

          ACME_WEBROOT="$APP_ROOT/certificates/www"
          ACME_CHALLENGE_DIR="$ACME_WEBROOT/.well-known/acme-challenge"

          ACME_TEST_TOKEN="${1:?ACME test token is required}"
          ACME_TEST_RESPONSE="${2:?ACME test response is required}"

          ACME_TEST_FILE="$ACME_CHALLENGE_DIR/$ACME_TEST_TOKEN"

          export IMAGE

          if [[ ! "$ACME_TEST_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "ERROR: Invalid ACME test token."
            exit 1
          fi

          if [[ -z "$ACME_TEST_RESPONSE" ]]; then
            echo "ERROR: ACME test response cannot be empty."
            exit 1
          fi

          cd "$APP_ROOT"

          echo "========================================"
          echo "STAGING DEPLOYMENT"
          echo "========================================"

          echo "Source directory: $SOURCE_DIR"
          echo "Image: $IMAGE"
          echo "ACME token: $ACME_TEST_TOKEN"

          # ------------------------------------------------
          # 6. Verify deployment prerequisites
          # ------------------------------------------------

          echo "========================================"
          echo "CHECKING DEPLOYMENT PREREQUISITES"
          echo "========================================"

          test -s "$ENV_FILE"
          test -s "$ARCHIVE"

          docker --version
          docker compose version

          tar -tzf "$ARCHIVE" > /dev/null

          # ------------------------------------------------
          # 7. Initialize persistent ACME webroot
          # ------------------------------------------------

          echo "========================================"
          echo "INITIALIZING ACME HTTP-01 WEBROOT"
          echo "========================================"

          mkdir -p "$ACME_WEBROOT"

          docker run \
            --rm \
            --entrypoint sh \
            --volume "$ACME_WEBROOT:/webroot" \
            nginx:1.28-alpine \
            -c '
              set -eu
              mkdir -p /webroot/.well-known/acme-challenge
              chmod 755 /webroot
              chmod 755 /webroot/.well-known
              chmod 755 /webroot/.well-known/acme-challenge
            '

          mkdir -p "$ACME_CHALLENGE_DIR"

          echo "ACME webroot initialized."

          # ------------------------------------------------
          # 8. Extract and validate source
          # ------------------------------------------------

          echo "========================================"
          echo "EXTRACTING STAGING SOURCE"
          echo "========================================"

          EXTRACT_DIR="$(mktemp -d /tmp/adama-staging-source.XXXXXX)"

          trap 'rm -rf -- "$EXTRACT_DIR"; rm -f -- "$ARCHIVE"' EXIT

          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR"

          test -f "$EXTRACT_DIR/docker/Dockerfile"
          test -f "$EXTRACT_DIR/docker/compose.yml"
          test -f "$EXTRACT_DIR/docker/compose.staging.yml"
          test -f "$EXTRACT_DIR/docker/compose.gateway.yml"
          test -f "$EXTRACT_DIR/nginx/nginx.conf"
          test -f "$EXTRACT_DIR/nginx/gateway.conf"

          # ------------------------------------------------
          # 9. Verify ACME source configuration
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING ACME SOURCE CONFIGURATION"
          echo "========================================"

          grep -Fq \
            '/opt/adama-revenue/web_app/certificates/www:/var/www/certbot:ro' \
            "$EXTRACT_DIR/docker/compose.gateway.yml"

          grep -Fq \
            'location ^~ /.well-known/acme-challenge/' \
            "$EXTRACT_DIR/nginx/gateway.conf"

          echo "ACME source configuration verified."

          # ------------------------------------------------
          # 10. Update source-staging
          # ------------------------------------------------

          echo "========================================"
          echo "UPDATING STAGING SOURCE"
          echo "========================================"

          mkdir -p "$SOURCE_DIR"

          find "$SOURCE_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -exec rm -rf -- {} +

          cp -a "$EXTRACT_DIR/." "$SOURCE_DIR/"

          rm -rf -- "$EXTRACT_DIR"

          # ------------------------------------------------
          # 11. Read staging API URL
          # ------------------------------------------------

          echo "Reading staging API URL..."

          NEXT_PUBLIC_API_URL="$(
            sed -n 's/^NEXT_PUBLIC_API_URL=//p' "$ENV_FILE" | tail -n 1
          )"

          test -n "$NEXT_PUBLIC_API_URL"

          case "$NEXT_PUBLIC_API_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: Invalid NEXT_PUBLIC_API_URL."
              exit 1
              ;;
          esac

          # ------------------------------------------------
          # 12. Build Next.js Docker image
          # ------------------------------------------------

          echo "========================================"
          echo "BUILDING STAGING DOCKER IMAGE"
          echo "========================================"

          docker build \
            --pull \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -f "$SOURCE_DIR/docker/Dockerfile" \
            -t "$IMAGE" \
            "$SOURCE_DIR"

          echo "Docker image built successfully."

          # ------------------------------------------------
          # 13. Validate application Compose configuration
          # ------------------------------------------------

          echo "Validating application Compose configuration..."

          docker compose \
            -p my-next-staging \
            -f "$SOURCE_DIR/docker/compose.yml" \
            -f "$SOURCE_DIR/docker/compose.staging.yml" \
            config -q

          # ------------------------------------------------
          # 14. Deploy Next.js application
          # ------------------------------------------------

          echo "========================================"
          echo "DEPLOYING STAGING APPLICATION"
          echo "========================================"

          docker compose \
            -p my-next-staging \
            -f "$SOURCE_DIR/docker/compose.yml" \
            -f "$SOURCE_DIR/docker/compose.staging.yml" \
            up -d --remove-orphans

          # ------------------------------------------------
          # 15. Wait for application health
          # ------------------------------------------------

          echo "Waiting for staging application health..."

          CONTAINER_ID="$(
            docker compose \
              -p my-next-staging \
              -f "$SOURCE_DIR/docker/compose.yml" \
              -f "$SOURCE_DIR/docker/compose.staging.yml" \
              ps -q app
          )"

          if [ -z "$CONTAINER_ID" ]; then
            echo "ERROR: Staging application container was not found."
            exit 1
          fi

          HEALTHY=false

          for attempt in $(seq 1 30); do

            STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                "$CONTAINER_ID"
            )"

            echo "Application health: $STATUS ($attempt/30)"

            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              break
            fi

            if [ "$STATUS" = "no-healthcheck" ]; then
              echo "ERROR: Application container has no Docker healthcheck."
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Staging application health check failed."
            docker logs --tail 100 "$CONTAINER_ID"
            exit 1
          fi

          echo "Staging application is healthy."

          # ------------------------------------------------
          # 16. Verify staging Docker network
          # ------------------------------------------------

          echo "Checking staging Docker network..."

          docker network inspect my-next-staging_app-network > /dev/null

          # ------------------------------------------------
          # 17. Validate Nginx gateway Compose configuration
          # ------------------------------------------------

          echo "Validating Nginx gateway Compose configuration..."

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            config -q

          # ------------------------------------------------
          # 18. Test Nginx configuration
          # ------------------------------------------------

          echo "Testing Nginx configuration..."

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            run --rm --no-deps nginx nginx -t

          # ------------------------------------------------
          # 19. Deploy Nginx gateway
          # ------------------------------------------------

          echo "========================================"
          echo "DEPLOYING NGINX GATEWAY"
          echo "========================================"

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            up -d --force-recreate --remove-orphans

          # ------------------------------------------------
          # 20. Identify running Nginx container
          # ------------------------------------------------

          GATEWAY_CONTAINER_ID="$(
            docker compose \
              -p my-next-gateway \
              -f "$SOURCE_DIR/docker/compose.gateway.yml" \
              ps -q nginx
          )"

          if [ -z "$GATEWAY_CONTAINER_ID" ]; then
            echo "ERROR: Nginx gateway container was not found."
            exit 1
          fi

          # ------------------------------------------------
          # 21. Verify live Nginx configuration
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING LIVE NGINX CONFIGURATION"
          echo "========================================"

          docker exec "$GATEWAY_CONTAINER_ID" nginx -t

          LIVE_NGINX_CONFIG="$(
            docker exec "$GATEWAY_CONTAINER_ID" nginx -T 2>&1
          )"

          if ! grep -Fq \
            'location ^~ /.well-known/acme-challenge/' \
            <<< "$LIVE_NGINX_CONFIG"; then

            echo "ERROR: ACME location is missing from live Nginx."
            exit 1
          fi

          echo "Live Nginx ACME configuration verified."

          # ------------------------------------------------
          # 22. Verify ACME webroot volume
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING ACME WEBROOT VOLUME"
          echo "========================================"

          ACTUAL_MOUNT_SOURCE="$(
            docker inspect "$GATEWAY_CONTAINER_ID" \
              --format '{{range .Mounts}}{{if eq .Destination "/var/www/certbot"}}{{.Source}}{{end}}{{end}}'
          )"

          if [ "$ACTUAL_MOUNT_SOURCE" != "$ACME_WEBROOT" ]; then
            echo "ERROR: ACME webroot mount is incorrect."
            echo "Expected: $ACME_WEBROOT"
            echo "Actual:   $ACTUAL_MOUNT_SOURCE"
            exit 1
          fi

          echo "ACME webroot volume verified."

          # ------------------------------------------------
          # 23. Verify staging HTTP endpoint
          # ------------------------------------------------

          echo "========================================"
          echo "CHECKING STAGING HTTP ENDPOINT"
          echo "========================================"

          GATEWAY_READY=false

          for attempt in $(seq 1 15); do

            HTTP_STATUS="$(
              curl \
                --noproxy '*' \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 3 \
                --max-time 5 \
                http://127.0.0.1/ || true
            )"

            echo "Gateway HTTP status: $HTTP_STATUS ($attempt/15)"

            case "$HTTP_STATUS" in
              2??|3??)
                GATEWAY_READY=true
                break
                ;;
            esac

            sleep 2
          done

          if [ "$GATEWAY_READY" != "true" ]; then
            echo "ERROR: Staging HTTP endpoint is unavailable."

            docker compose \
              -p my-next-gateway \
              -f "$SOURCE_DIR/docker/compose.gateway.yml" \
              logs --tail 100 nginx

            exit 1
          fi

          echo "Staging HTTP endpoint is responding."

          # ------------------------------------------------
          # 24. Create temporary ACME test challenge
          # ------------------------------------------------

          echo "========================================"
          echo "CREATING TEMPORARY ACME CHALLENGE"
          echo "========================================"

          mkdir -p "$ACME_CHALLENGE_DIR"

          printf '%s' "$ACME_TEST_RESPONSE" > "$ACME_TEST_FILE"

          chmod 644 "$ACME_TEST_FILE"

          if [ ! -f "$ACME_TEST_FILE" ]; then
            echo "ERROR: ACME challenge file was not created."
            exit 1
          fi

          if ! printf '%s' "$ACME_TEST_RESPONSE" | cmp -s - "$ACME_TEST_FILE"; then
            echo "ERROR: ACME challenge creation produced incorrect content."

            echo "Expected bytes:"
            printf '%s' "$ACME_TEST_RESPONSE" | od -An -tx1c

            echo "Actual bytes:"
            od -An -tx1c "$ACME_TEST_FILE"

            exit 1
          fi

          echo "Temporary ACME challenge created successfully."
          echo "Challenge file: $ACME_TEST_FILE"
          echo "Challenge size: $(wc -c < "$ACME_TEST_FILE") bytes"

          # ------------------------------------------------
          # 25. Verify challenge file inside Nginx
          # ------------------------------------------------

          echo "========================================"
          echo "VERIFYING CHALLENGE FILE INSIDE NGINX"
          echo "========================================"

          CONTAINER_FILE="/var/www/certbot/.well-known/acme-challenge/$ACME_TEST_TOKEN"

          if ! docker exec "$GATEWAY_CONTAINER_ID" test -s "$CONTAINER_FILE"; then
            echo "ERROR: Challenge file is missing inside Nginx."
            exit 1
          fi

          CONTAINER_RESPONSE="$(
            docker exec "$GATEWAY_CONTAINER_ID" cat "$CONTAINER_FILE"
          )"

          if [ "$CONTAINER_RESPONSE" != "$ACME_TEST_RESPONSE" ]; then
            echo "ERROR: Nginx challenge content does not match."

            echo "Expected length: ${#ACME_TEST_RESPONSE}"
            echo "Actual length:   ${#CONTAINER_RESPONSE}"

            exit 1
          fi

          echo "ACME challenge file is accessible inside Nginx."

          # ------------------------------------------------
          # 26. Verify local HTTP-01 endpoint
          # ------------------------------------------------

          echo "========================================"
          echo "TESTING LOCAL HTTP-01 ENDPOINT"
          echo "========================================"

          LOCAL_RESPONSE="$(
            curl \
              --noproxy '*' \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 3 \
              --max-time 10 \
              "http://127.0.0.1/.well-known/acme-challenge/$ACME_TEST_TOKEN"
          )"

          if [ "$LOCAL_RESPONSE" != "$ACME_TEST_RESPONSE" ]; then
            echo "ERROR: Local HTTP-01 verification failed."
            echo "Expected: $ACME_TEST_RESPONSE"
            echo "Received: $LOCAL_RESPONSE"
            exit 1
          fi

          echo "Local HTTP-01 verification successful."

          # ------------------------------------------------
          # 27. Verify challenge file still exists
          # ------------------------------------------------

          if [ ! -s "$ACME_TEST_FILE" ]; then
            echo "ERROR: Remote challenge file disappeared."
            exit 1
          fi

          if ! printf '%s' "$ACME_TEST_RESPONSE" | cmp -s - "$ACME_TEST_FILE"; then
            echo "ERROR: Remote challenge file changed after creation."
            exit 1
          fi

          echo "Remote challenge file confirmed."

          # ------------------------------------------------
          # 28. Display deployment status
          # ------------------------------------------------

          echo ""
          echo "========================================"
          echo "STAGING APPLICATION STATUS"
          echo "========================================"

          docker compose \
            -p my-next-staging \
            -f "$SOURCE_DIR/docker/compose.yml" \
            -f "$SOURCE_DIR/docker/compose.staging.yml" \
            ps

          echo ""
          echo "========================================"
          echo "NGINX GATEWAY STATUS"
          echo "========================================"

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            ps

          echo ""
          echo "========================================"
          echo "STAGING DEPLOYMENT COMPLETED"
          echo "========================================"

          echo "Application: http://196.190.216.41"
          echo "Gateway:     my-next-gateway"
          echo "Image:       $IMAGE"

          REMOTE

      # --------------------------------------------------
      # 6. Verify public ACME HTTP-01 endpoint
      # --------------------------------------------------

      - name: Verify public ACME HTTP-01 endpoint
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          URL="http://${STAGING_PUBLIC_IP}/.well-known/acme-challenge/${ACME_TEST_TOKEN}"

          EXPECTED_RESPONSE="$ACME_TEST_RESPONSE"

          RESPONSE_FILE="$RUNNER_TEMP/acme-public-response.txt"

          HTTP_STATUS="000"
          ACTUAL_RESPONSE=""

          echo "========================================"
          echo "VERIFYING REMOTE ACME CHALLENGE FILE"
          echo "========================================"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'bash -s --' "$ACME_TEST_TOKEN" "$ACME_TEST_RESPONSE" <<'REMOTE_CHECK'

          set -Eeuo pipefail

          TOKEN="${1:?ACME token is required}"
          EXPECTED="${2:?ACME response is required}"

          FILE="/opt/adama-revenue/web_app/certificates/www/.well-known/acme-challenge/$TOKEN"

          echo "Challenge file: $FILE"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Remote challenge file does not exist."
            exit 1
          fi

          ACTUAL="$(cat "$FILE")"

          echo "Expected length: ${#EXPECTED}"
          echo "Actual length:   ${#ACTUAL}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Remote ACME challenge content does not match."

            echo "Expected bytes:"
            printf '%s' "$EXPECTED" | od -An -tx1c

            echo "Actual bytes:"
            od -An -tx1c "$FILE"

            exit 1
          fi

          echo "Remote ACME challenge file exists and matches."

          REMOTE_CHECK

          echo "========================================"
          echo "TESTING PUBLIC ACME HTTP-01 ENDPOINT"
          echo "========================================"

          echo "URL: $URL"
          echo "Expected response: $EXPECTED_RESPONSE"

          PUBLIC_READY=false

          for attempt in $(seq 1 15); do

            : > "$RESPONSE_FILE"

            HTTP_STATUS="$(
              curl \
                --noproxy '*' \
                --silent \
                --show-error \
                --output "$RESPONSE_FILE" \
                --write-out '%{http_code}' \
                --connect-timeout 5 \
                --max-time 10 \
                "$URL" 2>/dev/null || true
            )"

            ACTUAL_RESPONSE="$(cat "$RESPONSE_FILE" 2>/dev/null || true)"

            echo "Public HTTP status: $HTTP_STATUS ($attempt/15)"

            if [ "$HTTP_STATUS" = "200" ] && \
               [ "$ACTUAL_RESPONSE" = "$EXPECTED_RESPONSE" ]; then
              PUBLIC_READY=true
              break
            fi

            echo "Public ACME verification not successful yet."

            sleep 3
          done

          if [ "$PUBLIC_READY" != "true" ]; then
            echo "========================================"
            echo "PUBLIC ACME VERIFICATION FAILED"
            echo "========================================"

            echo "URL: $URL"
            echo "HTTP status: $HTTP_STATUS"
            echo "Expected: $EXPECTED_RESPONSE"
            echo "Received: $ACTUAL_RESPONSE"

            exit 1
          fi

          echo "========================================"
          echo "PUBLIC ACME HTTP-01 VERIFIED"
          echo "========================================"

          echo "Public IP: $STAGING_PUBLIC_IP"
          echo "HTTP status: 200"
          echo "Challenge response: verified"

      # --------------------------------------------------
      # 7. Always clean up temporary ACME test file
      # --------------------------------------------------

      - name: Clean up temporary ACME challenge
        if: always()
        continue-on-error: true
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          echo "========================================"
          echo "CLEANING TEMPORARY ACME CHALLENGE"
          echo "========================================"

          if [ ! -f "$HOME/.ssh/id_ed25519" ]; then
            echo "SSH key unavailable. Skipping remote cleanup."
            exit 0
          fi

          if [ -z "${STAGING_HOST:-}" ] || [ -z "${STAGING_USER:-}" ]; then
            echo "SSH connection settings unavailable. Skipping remote cleanup."
            exit 0
          fi

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" \
            'bash -s --' "$ACME_TEST_TOKEN" <<'REMOTE_CLEANUP'

          set -Eeuo pipefail

          TOKEN="${1:?ACME token is required}"

          if [[ ! "$TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "ERROR: Invalid ACME cleanup token."
            exit 1
          fi

          FILE="/opt/adama-revenue/web_app/certificates/www/.well-known/acme-challenge/$TOKEN"

          if [ -f "$FILE" ]; then
            rm -f -- "$FILE"
            echo "Temporary ACME challenge removed."
          else
            echo "Temporary ACME challenge does not exist. Nothing to remove."
          fi

          REMOTE_CLEANUP

          echo "ACME cleanup completed."