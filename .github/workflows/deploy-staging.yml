
name: Deploy Staging

on:
  push:
    branches:
      - staging

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Configure SSH
      # --------------------------------------------------

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # --------------------------------------------------
      # 3. Package application source
      # --------------------------------------------------

      - name: Package application source
        run: |
          set -Eeuo pipefail

          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='coverage' \
            -czf "$RUNNER_TEMP/staging-source.tar.gz" .

          test -s "$RUNNER_TEMP/staging-source.tar.gz"

      # --------------------------------------------------
      # 4. Transfer source code to staging server
      # --------------------------------------------------

      - name: Transfer source code
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"

          scp \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/staging-source.tar.gz" \
            "$STAGING_USER@$STAGING_HOST:/tmp/adama-staging-source.tar.gz"

      # --------------------------------------------------
      # 5. Build and deploy application + gateway
      # --------------------------------------------------

      - name: Build and deploy staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes \
            "$STAGING_USER@$STAGING_HOST" 'bash -s' <<'REMOTE'

          set -Eeuo pipefail

          # ------------------------------------------------
          # Deployment configuration
          # ------------------------------------------------

          APP_ROOT="/opt/adama-revenue/web_app"

          SOURCE_DIR="$APP_ROOT/source-staging"
          DEPLOY_SOURCE_DIR="$APP_ROOT/.source-staging-deploy"
          OLD_SOURCE_DIR="$APP_ROOT/.source-staging-previous"

          ENV_FILE="$APP_ROOT/.env.staging"
          ARCHIVE="/tmp/adama-staging-source.tar.gz"

          IMAGE="adama-revenue-web:staging"

          export IMAGE

          cd "$APP_ROOT"

          # ------------------------------------------------
          # 6. Verify deployment prerequisites
          # ------------------------------------------------

          echo "========================================"
          echo "Checking deployment prerequisites"
          echo "========================================"

          test -s "$ENV_FILE"
          test -s "$ARCHIVE"

          docker --version
          docker compose version

          tar -tzf "$ARCHIVE" > /dev/null

          # ------------------------------------------------
          # 7. Prepare new source directory
          # ------------------------------------------------

          echo "Preparing staging source..."

          rm -rf "$DEPLOY_SOURCE_DIR"
          mkdir -p "$DEPLOY_SOURCE_DIR"

          tar -xzf "$ARCHIVE" -C "$DEPLOY_SOURCE_DIR"

          rm -f "$ARCHIVE"

          # Verify required files.

          test -f "$DEPLOY_SOURCE_DIR/docker/Dockerfile"
          test -f "$DEPLOY_SOURCE_DIR/docker/compose.yml"
          test -f "$DEPLOY_SOURCE_DIR/docker/compose.staging.yml"
          test -f "$DEPLOY_SOURCE_DIR/docker/compose.gateway.yml"
          test -f "$DEPLOY_SOURCE_DIR/nginx/nginx.conf"
          test -f "$DEPLOY_SOURCE_DIR/nginx/gateway.conf"

          # ------------------------------------------------
          # 8. Read staging API URL
          # ------------------------------------------------

          echo "Reading staging API URL..."

          NEXT_PUBLIC_API_URL="$(
            sed -n 's/^NEXT_PUBLIC_API_URL=//p' "$ENV_FILE" | tail -n 1
          )"

          test -n "$NEXT_PUBLIC_API_URL"

          case "$NEXT_PUBLIC_API_URL" in
            http://*|https://*)
              ;;
            *)
              echo "ERROR: Invalid NEXT_PUBLIC_API_URL."
              exit 1
              ;;
          esac

          # ------------------------------------------------
          # 9. Build Next.js Docker image
          # ------------------------------------------------

          echo "========================================"
          echo "Building staging Docker image"
          echo "========================================"

          docker build \
            --pull \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -f "$DEPLOY_SOURCE_DIR/docker/Dockerfile" \
            -t "$IMAGE" \
            "$DEPLOY_SOURCE_DIR"

          echo "Docker image built successfully."

          # ------------------------------------------------
          # 10. Validate application Compose configuration
          # ------------------------------------------------

          echo "Validating application Compose configuration..."

          docker compose \
            -p my-next-staging \
            -f "$DEPLOY_SOURCE_DIR/docker/compose.yml" \
            -f "$DEPLOY_SOURCE_DIR/docker/compose.staging.yml" \
            config -q

          # ------------------------------------------------
          # 11. Deploy Next.js application
          # ------------------------------------------------

          echo "========================================"
          echo "Deploying staging application"
          echo "========================================"

          docker compose \
            -p my-next-staging \
            -f "$DEPLOY_SOURCE_DIR/docker/compose.yml" \
            -f "$DEPLOY_SOURCE_DIR/docker/compose.staging.yml" \
            up -d --remove-orphans

          # ------------------------------------------------
          # 12. Wait for application health
          # ------------------------------------------------

          echo "Waiting for staging application health..."

          CONTAINER_ID="$(
            docker compose \
              -p my-next-staging \
              -f "$DEPLOY_SOURCE_DIR/docker/compose.yml" \
              -f "$DEPLOY_SOURCE_DIR/docker/compose.staging.yml" \
              ps -q app
          )"

          test -n "$CONTAINER_ID"

          HEALTHY=false

          for attempt in $(seq 1 30); do

            STATUS="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                "$CONTAINER_ID" 2>/dev/null || echo "unknown"
            )"

            echo "Application health: $STATUS ($attempt/30)"

            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=true
              break
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then

            echo "ERROR: Staging application health check failed."

            docker logs --tail 100 "$CONTAINER_ID"

            exit 1
          fi

          echo "Staging application is healthy."

          # ------------------------------------------------
          # 13. Verify staging Docker network
          # ------------------------------------------------

          echo "Checking staging Docker network..."

          docker network inspect my-next-staging_app-network > /dev/null

          # ------------------------------------------------
          # 14. Validate Nginx gateway Compose configuration
          # ------------------------------------------------

          echo "Validating Nginx gateway Compose configuration..."

          docker compose \
            -p my-next-gateway \
            -f "$DEPLOY_SOURCE_DIR/docker/compose.gateway.yml" \
            config -q

          # ------------------------------------------------
          # 15. Test Nginx configuration
          # ------------------------------------------------

          echo "Testing Nginx configuration..."

          docker compose \
            -p my-next-gateway \
            -f "$DEPLOY_SOURCE_DIR/docker/compose.gateway.yml" \
            run --rm --no-deps nginx nginx -t

          # ------------------------------------------------
          # 16. Promote new source directory
          # ------------------------------------------------

          echo "Promoting staging source..."

          rm -rf "$OLD_SOURCE_DIR"

          if [ -d "$SOURCE_DIR" ]; then
            mv "$SOURCE_DIR" "$OLD_SOURCE_DIR"
          fi

          mv "$DEPLOY_SOURCE_DIR" "$SOURCE_DIR"

          # ------------------------------------------------
          # 17. Deploy Nginx gateway automatically
          # ------------------------------------------------

          echo "========================================"
          echo "Deploying Nginx gateway"
          echo "========================================"

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            up -d --force-recreate --remove-orphans

          # ------------------------------------------------
          # 18. Verify Nginx configuration
          # ------------------------------------------------

          echo "Verifying Nginx configuration..."

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            exec -T nginx nginx -t

          # ------------------------------------------------
          # 19. Verify staging HTTP endpoint
          # ------------------------------------------------

          echo "========================================"
          echo "Checking staging HTTP endpoint"
          echo "========================================"

          GATEWAY_READY=false

          for attempt in $(seq 1 15); do

            HTTP_STATUS="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 5 \
                http://127.0.0.1/ || true
            )"

            echo "Gateway HTTP status: $HTTP_STATUS ($attempt/15)"

            case "$HTTP_STATUS" in
              2??|3??)
                GATEWAY_READY=true
                break
                ;;
            esac

            sleep 2
          done

          if [ "$GATEWAY_READY" != "true" ]; then

            echo "ERROR: Nginx gateway verification failed."

            docker compose \
              -p my-next-gateway \
              -f "$SOURCE_DIR/docker/compose.gateway.yml" \
              logs --tail 100 nginx

            exit 1
          fi

          echo "Staging HTTP endpoint is responding."

          # ------------------------------------------------
          # 20. Remove previous source
          # ------------------------------------------------

          rm -rf "$OLD_SOURCE_DIR"

          # ------------------------------------------------
          # 21. Display deployment status
          # ------------------------------------------------

          echo ""
          echo "========================================"
          echo "STAGING APPLICATION STATUS"
          echo "========================================"

          docker compose \
            -p my-next-staging \
            -f "$SOURCE_DIR/docker/compose.yml" \
            -f "$SOURCE_DIR/docker/compose.staging.yml" \
            ps

          echo ""
          echo "========================================"
          echo "NGINX GATEWAY STATUS"
          echo "========================================"

          docker compose \
            -p my-next-gateway \
            -f "$SOURCE_DIR/docker/compose.gateway.yml" \
            ps

          echo ""
          echo "========================================"
          echo "STAGING DEPLOYMENT COMPLETED"
          echo "========================================"

          echo "Application: http://196.190.216.41"
          echo "Gateway:     my-next-gateway"
          echo "Image:       $IMAGE"

          REMOTE
