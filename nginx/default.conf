# =========================================================
# NGINX CONFIGURATION
# Application: Commercial Enforcement Web
# Frontend: Next.js Docker Container
# Backend: Laravel API
#
# Frontend Public IP:  196.190.216.41
# Frontend Private IP: 172.25.14.49
# Backend Public IP:   196.190.216.33
# Backend Private IP:  172.25.14.41
#
# Protocol: HTTP (temporary IP deployment)
# =========================================================


# =========================================================
# UPSTREAM SERVICES
# =========================================================

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

upstream laravel_api {
    # Use private network for internal communication
    server 172.25.14.41:80;
    keepalive 32;
}


# =========================================================
# HTTP — FRONTEND APPLICATION
# =========================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 196.190.216.41 _;

    client_max_body_size 20M;


    # =====================================================
    # SECURITY HEADERS
    # =====================================================

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;


    # =====================================================
    # CONTENT SECURITY POLICY
    # =====================================================

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data: http: https:; connect-src 'self'; media-src 'self' blob: http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; frame-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;


    # =====================================================
    # HEALTH CHECK
    # =====================================================

    location = /health {
        access_log off;
        log_not_found off;

        default_type text/plain;

        return 200 "healthy\n";
    }


    # =====================================================
    # LARAVEL API
    #
    # Browser:
    # http://196.190.216.41/api/users
    #
    # Nginx forwards to:
    # http://172.25.14.41/api/v1/users
    # =====================================================

    location /api/ {

        proxy_pass http://laravel_api/api/v1/;

        proxy_http_version 1.1;

        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Connection
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_redirect off;
    }


    # =====================================================
    # NEXT.JS APPLICATION
    # =====================================================

    location / {

        proxy_pass http://frontend;

        proxy_http_version 1.1;

        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Next.js WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering off;

        proxy_redirect off;
    }
}