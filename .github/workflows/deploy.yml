
name: Deploy Adama Municipal Revenue Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adama-revenue-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Frontend to BUSA-Gonofa2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using Docker Compose
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}

          port: 22
          timeout: 30s
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            APP_DIR="/opt/adama-revenue/web_app"
            PUBLIC_IP="196.190.216.41"

            echo "======================================"
            echo "Adama Revenue Frontend Deployment"
            echo "======================================"

            cd "$APP_DIR"

            echo "Checking deployment prerequisites..."

            command -v docker
            command -v curl
            docker compose version

            test -f Dockerfile
            test -f docker-compose.yml
            test -f .env.production
            test -f nginx/default.conf

            echo "Updating application source..."

            git fetch origin main
            git reset --hard origin/main

            echo "Building frontend Docker image..."

            docker compose build --pull frontend

            echo "Starting frontend services..."

            docker compose up -d --remove-orphans

            echo "Validating Nginx configuration..."

            docker compose exec -T nginx nginx -t

            echo "Reloading Nginx..."

            docker compose exec -T nginx nginx -s reload

            echo "Waiting for frontend container health..."

            HEALTHY=0

            for i in $(seq 1 30); do

              STATUS=$(docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                frontend-app 2>/dev/null || true)

              echo "Frontend status: ${STATUS:-unknown}"

              if [ "$STATUS" = "healthy" ]; then
                HEALTHY=1
                break
              fi

              sleep 5
            done

            if [ "$HEALTHY" -ne 1 ]; then

              echo "Frontend container health check failed."

              docker compose ps
              docker compose logs --tail=100 frontend nginx

              exit 1
            fi

            echo "Checking HTTPS application response..."

            HTTP_STATUS=$(curl \
              --connect-timeout 10 \
              --max-time 30 \
              --silent \
              --show-error \
              --fail \
              --location \
              --resolve "${PUBLIC_IP}:443:127.0.0.1" \
              --output /dev/null \
              --write-out "%{http_code}" \
              "https://${PUBLIC_IP}/")

            echo "HTTPS response status: ${HTTP_STATUS}"

            if [ "$HTTP_STATUS" != "200" ]; then

              echo "HTTPS application health check failed."

              docker compose ps
              docker compose logs --tail=100 frontend nginx

              exit 1
            fi

            echo "======================================"
            echo "Deployment successful"
            echo "======================================"

            docker compose ps

            echo "Deployment completed successfully."
