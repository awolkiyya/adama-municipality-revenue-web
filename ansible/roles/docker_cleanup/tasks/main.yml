
---
- name: Get all Docker containers
  ansible.builtin.command:
    cmd: docker ps -aq
  register: docker_cleanup_all_containers
  changed_when: false
  when: docker_cleanup_remove_containers | bool

- name: Remove all Docker containers
  ansible.builtin.command:
    argv: "{{ ['docker', 'rm', '-f'] + docker_cleanup_all_containers.stdout_lines }}"
  when:
    - docker_cleanup_remove_containers | bool
    - docker_cleanup_all_containers.stdout_lines | length > 0
  changed_when: true

- name: Remove unused Docker images
  ansible.builtin.command:
    cmd: docker image prune -a -f
  when: docker_cleanup_remove_images | bool
  changed_when: true

- name: Remove unused Docker networks
  ansible.builtin.command:
    cmd: docker network prune -f
  when: docker_cleanup_remove_networks | bool
  changed_when: true

- name: Remove unused Docker volumes
  ansible.builtin.command:
    cmd: docker volume prune -a -f
  when: docker_cleanup_remove_volumes | bool
  changed_when: true

- name: Remove Docker build cache
  ansible.builtin.command:
    cmd: docker builder prune -a -f
  when: docker_cleanup_remove_build_cache | bool
  changed_when: true