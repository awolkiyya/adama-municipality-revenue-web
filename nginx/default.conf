
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

# HTTP: ACME validation and HTTPS redirect
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name 196.190.216.41 _;

    server_tokens off;
    client_max_body_size 20M;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://196.190.216.41$request_uri;
    }
}

# HTTPS: Main application
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name 196.190.216.41 _;

    server_tokens off;
    client_max_body_size 20M;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/196.190.216.41/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/196.190.216.41/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Next.js frontend
    # Next.js handles:
    # /api/*     -> Laravel /api/v1/*
    # /sanctum/* -> Laravel /sanctum/*
    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Request/response handling
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
    }
}
