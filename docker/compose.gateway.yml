
services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/adama-revenue/web_app/certificates/www:/var/www/certbot:ro
      - /opt/adama-revenue/web_app/certificates/conf:/etc/letsencrypt:ro

    networks:
      - staging-network
      - production-network

networks:
  staging-network:
    external: true
    name: my-next-staging_app-network

  production-network:
    external: true
    name: my-next-production_app-network
