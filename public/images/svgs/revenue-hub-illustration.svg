<svg viewBox="0 0 480 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotTexture" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2563EB" />
    </pattern>
    <radialGradient id="fadeMask" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <mask id="dotFade">
      <circle cx="240" cy="250" r="220" fill="url(#fadeMask)" />
    </mask>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <!-- ambient dot texture, faded at the edges -->
  <circle cx="240" cy="250" r="220" fill="url(#dotTexture)" opacity="0.14" mask="url(#dotFade)" />

  <!-- soft glow behind the hub -->
  <circle cx="240" cy="260" r="90" fill="#2563EB" opacity="0.16" filter="url(#softBlur)" />

  <!-- connector: Citizen ID -> Hub -->
  <path d="M 150,150 Q 190,190 205,215" stroke="#60A5FA" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" />
  <circle cx="165" cy="165" r="3" fill="#2563EB" />
  <circle cx="185" cy="188" r="3" fill="#2563EB" />
  <circle cx="200" cy="208" r="3" fill="#2563EB" />

  <!-- connector: Secure System -> Hub -->
  <path d="M 330,150 Q 295,190 278,215" stroke="#60A5FA" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" />
  <circle cx="315" cy="165" r="3" fill="#2563EB" />
  <circle cx="298" cy="188" r="3" fill="#2563EB" />
  <circle cx="283" cy="208" r="3" fill="#2563EB" />

  <!-- connector: Online Payment -> Hub -->
  <path d="M 240,366 L 240,324" stroke="#60A5FA" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" />
  <circle cx="240" cy="356" r="3" fill="#2563EB" />
  <circle cx="240" cy="344" r="3" fill="#2563EB" />
  <circle cx="240" cy="332" r="3" fill="#2563EB" />

  <!-- central hub: the system -->
  <circle cx="240" cy="260" r="76" fill="#2563EB" fill-opacity="0.10" stroke="#1D4ED8" stroke-width="2.5" />
  <g stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round" fill="none">
    <path d="M212 250 L240 228 L268 250 Z" />
    <rect x="216" y="250" width="48" height="34" rx="2" />
    <line x1="226" y1="256" x2="226" y2="284" />
    <line x1="240" y1="256" x2="240" y2="284" />
    <line x1="254" y1="256" x2="254" y2="284" />
  </g>
  <rect x="216" y="250" width="48" height="34" rx="2" fill="#1D4ED8" fill-opacity="0.08" />

  <!-- node: Citizen ID -->
  <circle cx="110" cy="120" r="54" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
  <rect x="86" y="104" width="48" height="32" rx="5" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8" />
  <circle cx="98" cy="114" r="6" fill="none" stroke="#1D4ED8" stroke-width="1.6" />
  <path d="M92 128 Q98 122 104 128" stroke="#1D4ED8" stroke-width="1.4" fill="none" />
  <line x1="112" y1="112" x2="128" y2="112" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" />
  <line x1="112" y1="119" x2="128" y2="119" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" />
  <line x1="112" y1="126" x2="124" y2="126" stroke="#1D4ED8" stroke-width="1.6" stroke-linecap="round" />

  <!-- node: Secure System -->
  <circle cx="370" cy="120" r="54" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
  <path
    d="M370 96 L392 104 C392 122 383 136 370 144 C357 136 348 122 348 104 Z"
    fill="#DBEAFE"
    stroke="#1D4ED8"
    stroke-width="1.8"
    stroke-linejoin="round"
  />
  <path d="M360 120 L367 128 L381 111" stroke="#1D4ED8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- node: Online Payment -->
  <circle cx="240" cy="420" r="54" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" />
  <circle cx="224" cy="420" r="17" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.8" />
  <path d="M224 412 L224 428 M219 415 Q224 411 229 415 M219 425 Q224 429 229 425" stroke="#1D4ED8" stroke-width="1.6" fill="none" stroke-linecap="round" />
  <path d="M248 432 L248 408 L262 408" stroke="#1D4ED8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M248 408 L262 408 L262 422" stroke="#1D4ED8" stroke-width="0" fill="none" />
  <line x1="248" y1="432" x2="264" y2="416" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" />
  <path d="M256 416 L264 416 L264 424" stroke="#1D4ED8" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
